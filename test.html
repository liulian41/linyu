<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>传讯 · 后台通知 Demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#6e6e73;--text3:#aeaeb2;
  --sep:rgba(60,60,67,.12);--blue:#007aff;--danger:#ff3b30;--green:#34c759;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.nav{display:flex;align-items:center;justify-content:center;height:54px;flex-shrink:0;
  background:rgba(249,249,249,.84);backdrop-filter:blur(30px) saturate(180%);
  border-bottom:.5px solid var(--sep);font-size:16px;font-weight:600;}
.scroll{flex:1;overflow-y:auto;padding:14px;scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;
  border:.5px solid var(--sep);box-shadow:0 4px 20px rgba(0,0,0,.05);}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.card p{margin:0 0 12px;font-size:13px;line-height:1.6;color:var(--text2);}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.row:last-child{margin-bottom:0;}
.row label{font-size:14px;flex-shrink:0;width:76px;color:var(--text2);}
input[type=text],input[type=number],textarea{
  flex:1;width:100%;padding:10px 12px;border-radius:10px;border:.5px solid var(--sep);
  background:#f5f5f7;color:var(--text);font-size:15px;outline:none;font-family:inherit;resize:none;
}
input:focus,textarea:focus{border-color:var(--blue);}
.btn{width:100%;padding:12px;border-radius:12px;background:var(--blue);color:#fff;
  font-size:15px;font-weight:600;border:none;cursor:pointer;transition:transform .15s,opacity .2s;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:#f0f0f3;color:var(--text);}
.btn.danger{background:var(--danger);}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn-row{display:flex;gap:10px;margin-top:10px;}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 12px;
  border-radius:10px;background:#f0f0f3;margin-top:10px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.dot.on{background:var(--green);}
.dot.off{background:var(--danger);}
.list{font-size:13px;color:var(--text2);line-height:1.8;}
.list .item{padding:8px 0;border-bottom:.5px solid var(--sep);display:flex;
  justify-content:space-between;align-items:center;gap:10px;}
.list .item:last-child{border-bottom:none;}
.log{font-size:12px;line-height:1.7;color:var(--text2);max-height:180px;overflow-y:auto;
  background:#f5f5f7;border-radius:10px;padding:10px;font-family:ui-monospace,monospace;}
.log .l{padding:1px 0;word-break:break-all;}
.log .l.err{color:var(--danger);}
.log .l.ok{color:var(--green);}
.switch{width:50px;height:30px;border-radius:15px;background:#d1d1d6;position:relative;
  transition:background .3s;flex-shrink:0;border:none;padding:0;cursor:pointer;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s;}
.switch.on{background:var(--green);}
.switch.on::after{transform:translateX(20px);}
#installBtn{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:100;display:none;box-shadow:0 8px 30px rgba(0,122,255,.35);}
#installBtn.show{display:block;}
#iosHint{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:none;
  align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);}
#iosHint.show{display:flex;}
#iosHint .box{background:#fff;border-radius:18px;padding:22px;max-width:320px;width:100%;}
#iosHint h4{margin:0 0 10px;font-size:16px;}
#iosHint p{margin:0 0 16px;font-size:13.5px;line-height:1.7;color:var(--text2);}
</style>
</head>
<body>

<div class="nav">传讯 · 后台通知</div>

<div class="scroll">

  <div class="card">
    <h3>状态</h3>
    <div class="status"><span class="dot" id="dotSW"></span><span id="txtSW">Service Worker: 检测中…</span></div>
    <div class="status"><span class="dot" id="dotPerm"></span><span id="txtPerm">通知权限: 检测中…</span></div>
    <div class="status"><span class="dot" id="dotKeep"></span><span id="txtKeep">静音保活: 关闭</span></div>
    <div class="status"><span class="dot" id="dotVis"></span><span id="txtVis">页面状态: 可见</span></div>
  </div>

  <div class="card">
    <h3>调度一条延时通知</h3>
    <p>填好延时和内容后点「调度」，然后<strong>立刻切到别的 App 或锁屏</strong>，验证到点是否弹出通知。</p>
    <div class="row"><label>延时(秒)</label><input type="number" id="delaySec" value="10" min="1" step="1"></div>
    <div class="row"><label>标题</label><input type="text" id="titleInput" value="传讯" placeholder="通知标题"></div>
    <div class="row"><label>内容</label><input type="text" id="bodyInput" value="对方给你发来一条新消息" placeholder="通知内容"></div>
    <button class="btn" id="btnSchedule">调度任务</button>
    <div class="btn-row">
      <button class="btn ghost" id="btnSchedule5" style="flex:1;">调度 5 分钟后</button>
      <button class="btn ghost" id="btnRequestPerm" style="flex:1;">申请通知权限</button>
    </div>
  </div>

  <div class="card">
    <h3>防冻结</h3>
    <div class="row" style="justify-content:space-between;">
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:500;">静音音频保活</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px;">播放近乎无声的振荡器，提高后台存活率（需先手动开启一次）</div>
      </div>
      <button class="switch" id="swKeep"></button>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:14px;">
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:500;">屏幕常亮 Wake Lock</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px;">仅在前台可见时生效，切后台会自动释放</div>
      </div>
      <button class="switch" id="swWake"></button>
    </div>
  </div>

  <div class="card">
    <h3>任务列表</h3>
    <div class="list" id="taskList"><div style="color:var(--text3);text-align:center;padding:10px 0;">暂无任务</div></div>
  </div>

  <div class="card">
    <h3>运行日志</h3>
    <div class="log" id="logBox"></div>
    <div class="btn-row">
      <button class="btn ghost" id="btnPing" style="flex:1;">Ping SW</button>
      <button class="btn ghost" id="btnClearLog" style="flex:1;">清空日志</button>
    </div>
  </div>

</div>

<button class="btn" id="installBtn">添加到主屏幕</button>

<div id="iosHint">
  <div class="box">
    <h4>添加到主屏幕</h4>
    <p>在 Safari 中点击底部的「分享」按钮，然后选择「添加到主屏幕」。<br><br>只有安装为独立应用后，iOS 才允许在后台弹出系统通知。</p>
    <button class="btn" id="iosHintClose">我知道了</button>
  </div>
</div>

<script>
/* ============================================================
   bg-notify.js —— 主线程调度模块（可直接内联进你的项目）
   ============================================================ */
(function (global) {
  'use strict';

  var SW_URL = './sw.js';
  var SW_SCOPE = './';
  var MAX_SW_DELAY = 5 * 60 * 1000;  // 只有 5 分钟内的任务交给 SW
  var HOLD_CAP_MS  = 5 * 60 * 1000;  // SW waitUntil 保活上限

  var tasks    = new Map();   // id -> task
  var timers   = new Map();   // id -> timeoutId
  var handlers = new Set();   // 触发回调
  var reg      = null;
  var ready    = false;
  var reclaiming = false;

  var now   = function () { return Date.now(); };
  var genId = function () { return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  /* ---------- 日志（可删） ---------- */
  function log(msg, type) {
    if (global.__bgLog) global.__bgLog(msg, type);
  }

  /* ---------- 向 SW 发消息，带 ack ---------- */
  function postToSW(msg, timeout) {
    return new Promise(function (resolve) {
      var sw = navigator.serviceWorker.controller ||
               (reg && (reg.active || reg.waiting || reg.installing));
      if (!sw) { resolve(null); return; }
      var ch = new MessageChannel();
      var done = false;
      var tid = setTimeout(function () { finish(null); }, timeout || 4000);
      function finish(v) {
        if (done) return;
        done = true;
        clearTimeout(tid);
        try { ch.port1.close(); } catch (e) {}
        resolve(v);
      }
      ch.port1.onmessage = function (e) { finish(e.data); };
      try {
        sw.postMessage(msg, [ch.port2]);
      } catch (e) {
        finish(null);
      }
    });
  }

  /* ---------- 不等待 ack 的同步发送（pagehide 时用） ---------- */
  function postToSWNoAck(msg) {
    var sw = navigator.serviceWorker.controller || (reg && reg.active);
    if (sw) { try { sw.postMessage(msg); } catch (e) {} }
  }

  /* ---------- 初始化 ---------- */
  async function init() {
    if (!('serviceWorker' in navigator)) {
      log('[bg] 当前浏览器不支持 Service Worker', 'err');
      return false;
    }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      log('[bg] SW 需要 HTTPS 或 localhost，当前环境不可用', 'err');
      return false;
    }
    try {
      reg = await navigator.serviceWorker.register(SW_URL, { scope: SW_SCOPE });
      await navigator.serviceWorker.ready;
      reg = (await navigator.serviceWorker.getRegistration(SW_SCOPE)) || reg;
    } catch (e) {
      log('[bg] SW 注册失败: ' + e.message, 'err');
      return false;
    }

    navigator.serviceWorker.addEventListener('message', onSWMessage);
    document.addEventListener('visibilitychange', onVisibilityChange);
    global.addEventListener('pagehide', onPageHide);
    global.addEventListener('pageshow', onPageShow);
    global.addEventListener('online', function () {
      postToSW({ type: 'FLUSH' }).catch(function () {});
    });

    ready = true;
    log('[bg] SW 就绪: ' + (reg.active ? reg.active.scriptURL : '?'), 'ok');
    // 首次进入顺手回收一次，处理上次遗留任务
    reclaim();
    return true;
  }

  /* ---------- 页面可见性 ---------- */
  function onVisibilityChange() {
    if (document.visibilityState === 'hidden') {
      log('[bg] 页面隐藏 -> 交接任务给 SW');
      handoff();
    } else {
      log('[bg] 页面可见 -> 从 SW 回收任务');
      reclaim();
    }
  }

  function onPageHide() {
    // 兜底：同步发送一次，避免 visibilitychange 里没赶上
    var t0 = now();
    tasks.forEach(function (t) {
      if (t.fired) return;
      if (t.fireAt > t0 && t.fireAt - t0 <= MAX_SW_DELAY) {
        postToSWNoAck({ type: 'SCHEDULE', task: t });
      }
    });
  }

  function onPageShow() {
    reclaim();
  }

  /* ---------- 调度 ---------- */
  function schedule(opt) {
    var task = {
      id: opt.id || genId(),
      fireAt: opt.fireAt || (now() + (opt.delay || 0)),
      title: opt.title || '传讯',
      body: opt.body || '',
      tag: opt.tag || '',
      url: opt.url || location.href,
      payload: opt.payload || null,
      fired: false
    };
    tasks.set(task.id, task);
    log('[bg] 调度 ' + task.id + '，' + Math.round((task.fireAt - now()) / 1000) + 's 后触发');

    if (task.fireAt <= now()) {
      fireLocal(task);
    } else {
      armLocal(task);
      // 如果当前已经处于后台，立刻交给 SW
      if (document.visibilityState === 'hidden' && task.fireAt - now() <= MAX_SW_DELAY) {
        handoffOne(task);
      }
    }
    notifyListChanged();
    return task.id;
  }

  function cancel(id) {
    tasks.delete(id);
    clearLocal(id);
    postToSW({ type: 'CANCEL', id: id }).catch(function () {});
    notifyListChanged();
  }

  function clearAll() {
    tasks.forEach(function (t) { clearLocal(t.id); });
    tasks.clear();
    postToSW({ type: 'RECLAIM' }).catch(function () {});
    notifyListChanged();
  }

  function getTasks() {
    return Array.from(tasks.values()).sort(function (a, b) { return a.fireAt - b.fireAt; });
  }

  /* ---------- 页面内定时器 ---------- */
  function armLocal(task) {
    clearLocal(task.id);
    var delay = task.fireAt - now();
    if (delay <= 0) { fireLocal(task); return; }
    if (delay > 0x7fffffff) {
      // 超过 24.8 天，分段
      timers.set(task.id, setTimeout(function () { armLocal(task); }, 0x7fffffff));
      return;
    }
    timers.set(task.id, setTimeout(function () { fireLocal(task); }, delay));
  }

  function clearLocal(id) {
    var t = timers.get(id);
    if (t) { clearTimeout(t); timers.delete(id); }
  }

  async function fireLocal(task) {
    if (task.fired) return;
    clearLocal(task.id);

    if (document.visibilityState === 'visible') {
      // 前台：交给业务回调，不弹系统通知
      task.fired = true;
      tasks.delete(task.id);
      notifyListChanged();
      emit(task);
      log('[bg] 前台触发 ' + task.id, 'ok');
    } else {
      // 后台：本地定时器本来就不可靠，直接尝试系统通知
      await fireViaNotification(task);
    }
    postToSW({ type: 'CANCEL', id: task.id }).catch(function () {});
  }

  async function fireViaNotification(task) {
    if (!reg) { task.fired = true; tasks.delete(task.id); emit(task); return; }
    if (!('Notification' in global) || Notification.permission !== 'granted') {
      // 没权限，退回回调
      task.fired = true;
      tasks.delete(task.id);
      notifyListChanged();
      emit(task);
      return;
    }
    try {
      await reg.showNotification(task.title, {
        body: task.body,
        tag: task.tag || ('cx-' + task.id),
        data: { taskId: task.id, url: task.url, payload: task.payload },
        renotify: true,
        timestamp: task.fireAt
      });
      task.fired = true;
      tasks.delete(task.id);
      notifyListChanged();
      log('[bg] 后台直接弹通知 ' + task.id, 'ok');
    } catch (e) {
      log('[bg] 弹通知失败: ' + e.message, 'err');
    }
  }

  /* ---------- 交接给 SW ---------- */
  async function handoffOne(task) {
    clearLocal(task.id);   // 交接后由 SW 负责，页面不再本地触发
    var res = await postToSW({ type: 'SCHEDULE', task: task });
    if (!res || !res.ok) {
      armLocal(task);      // 交接失败，恢复本地定时器
      log('[bg] 交接失败，恢复本地定时器 ' + task.id, 'err');
      return false;
    }
    log('[bg] 已交接 ' + task.id + ' 给 SW', 'ok');
    return true;
  }

  async function handoff() {
    if (!ready) return;
    var t0 = now();
    var pending = [];
    tasks.forEach(function (t) {
      if (!t.fired && t.fireAt > t0 && t.fireAt - t0 <= MAX_SW_DELAY) pending.push(t);
    });
    if (!pending.length) return;
    log('[bg] 交接 ' + pending.length + ' 个任务给 SW');
    for (var i = 0; i < pending.length; i++) {
      await handoffOne(pending[i]);
    }
  }

  /* ---------- 从 SW 回收 ---------- */
  async function reclaim() {
    if (!ready || reclaiming) return;
    reclaiming = true;
    try {
      var res = await postToSW({ type: 'RECLAIM' }, 6000);
      if (res && res.ok && Array.isArray(res.tasks)) {
        var t0 = now();
        for (var i = 0; i < res.tasks.length; i++) {
          var t = res.tasks[i];
          if (t.fired) continue;
          tasks.set(t.id, t);
          if (t.fireAt <= t0) {
            // SW 没能触发、已经过期的任务 -> 立刻补
            log('[bg] 补触发过期任务 ' + t.id);
            fireLocal(t);
          } else {
            armLocal(t);
          }
        }
        notifyListChanged();
        if (res.tasks.length) log('[bg] 从 SW 回收 ' + res.tasks.length + ' 个任务');
      }
    } catch (e) {
      log('[bg] 回收失败: ' + e.message, 'err');
    } finally {
      reclaiming = false;
    }
  }

  /* ---------- SW 消息 ---------- */
  function onSWMessage(event) {
    var d = event.data || {};
    if (d.type === 'TASK_FIRED' && d.task) {
      var t = tasks.get(d.task.id) || d.task;
      if (!t.fired) {
        t.fired = true;
        tasks.delete(t.id);
        clearLocal(t.id);
        notifyListChanged();
        emit(t);
        log('[bg] SW 通知触发: ' + t.id, 'ok');
      }
    } else if (d.type === 'NOTIFICATION_CLICKED') {
      log('[bg] 用户点击通知: ' + JSON.stringify(d.data || {}));
      handlers.forEach(function (fn) {
        try { fn({ __type: 'click', data: d.data || {} }); } catch (e) {}
      });
    }
  }

  /* ---------- 事件派发 ---------- */
  function emit(task) {
    handlers.forEach(function (fn) {
      try { fn(task); } catch (e) { console.error(e); }
    });
  }

  function onFire(fn) {
    handlers.add(fn);
    return function () { handlers.delete(fn); };
  }

  function notifyListChanged() {
    if (global.__bgListChanged) global.__bgListChanged(getTasks());
  }

  /* ---------- 通知权限 ---------- */
  async function requestPermission() {
    if (!('Notification' in global)) return 'unsupported';
    if (Notification.permission === 'granted') return 'granted';
    if (Notification.permission === 'denied') return 'denied';
    try {
      return await Notification.requestPermission();
    } catch (e) {
      return 'error';
    }
  }

  function permission() {
    return ('Notification' in global) ? Notification.permission : 'unsupported';
  }

  /* ---------- Ping ---------- */
  async function ping() {
    var res = await postToSW({ type: 'PING' }, 3000);
    if (res && res.ok) log('[bg] SW 存活 version=' + res.version + ' now=' + res.now, 'ok');
    else log('[bg] SW 无响应', 'err');
    return res;
  }

  /* ---------- 导出 ---------- */
  global.BgNotify = {
    init: init,
    schedule: schedule,
    cancel: cancel,
    clearAll: clearAll,
    getTasks: getTasks,
    onFire: onFire,
    requestPermission: requestPermission,
    permission: permission,
    ping: ping,
    reclaim: reclaim,
    isReady: function () { return ready; }
  };

})(window);

/* ============================================================
   静音音频保活 + Wake Lock
   ============================================================ */
var KeepAlive = (function () {
  'use strict';
  var ctx = null, osc = null, gain = null, on = false;
  var wakeLock = null, wakeWanted = false;

  async function startAudio() {
    if (on) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') await ctx.resume();
      if (!osc) {
        osc = ctx.createOscillator();
        gain = ctx.createGain();
        gain.gain.value = 0.0001;   // 近乎无声，但足以让 AudioContext 保持 running
        osc.frequency.value = 40;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
      }
      on = true;
      bindMediaSession();
      document.addEventListener('visibilitychange', onVisibility);
      return true;
    } catch (e) {
      console.warn('[keep] AudioContext 启动失败', e);
      return false;
    }
  }

  function stopAudio() {
    on = false;
    document.removeEventListener('visibilitychange', onVisibility);
    try { if (osc) { osc.stop(); osc.disconnect(); } } catch (e) {}
    osc = null; gain = null;
    try { if (ctx) ctx.close(); } catch (e) {}
    ctx = null;
    try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = null; } catch (e) {}
  }

  function onVisibility() {
    if (!on || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume().catch(function () {});
  }

  function bindMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: '传讯后台保活',
        artist: '保持连接中',
        album: '传讯'
      });
      navigator.mediaSession.playbackState = 'playing';
      navigator.mediaSession.setActionHandler('pause', function () {});
      navigator.mediaSession.setActionHandler('play', function () {});
    } catch (e) {}
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return false;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }

  function setWakeWanted(v) {
    wakeWanted = v;
    if (!v) { releaseWakeLock(); return; }
    if (document.visibilityState === 'visible') requestWakeLock();
  }

  document.addEventListener('visibilitychange', function () {
    if (!wakeWanted) return;
    if (document.visibilityState === 'visible') requestWakeLock();
    else releaseWakeLock();
  });

  return {
    startAudio: startAudio,
    stopAudio: stopAudio,
    isAudioOn: function () { return on; },
    setWakeWanted: setWakeWanted,
    hasWakeLock: function () { return !!wakeLock; }
  };
})();

/* ============================================================
   添加到主屏幕引导
   ============================================================ */
var InstallGuide = (function () {
  'use strict';
  var deferred = null;
  var btn = document.getElementById('installBtn');
  var iosHint = document.getElementById('iosHint');

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }

  function showBtn() {
    if (isStandalone()) return;
    btn.classList.add('show');
  }

  function hideBtn() {
    btn.classList.remove('show');
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    showBtn();
  });

  window.addEventListener('appinstalled', function () {
    deferred = null;
    hideBtn();
    if (window.__bgLog) window.__bgLog('[a2hs] 已安装', 'ok');
  });

  btn.addEventListener('click', async function () {
    if (deferred) {
      deferred.prompt();
      var res = await deferred.userChoice;
      deferred = null;
      if (res.outcome === 'accepted') hideBtn();
      return;
    }
    // iOS / 不支持 beforeinstallprompt 的浏览器
    iosHint.classList.add('show');
  });

  document.getElementById('iosHintClose').addEventListener('click', function () {
    iosHint.classList.remove('show');
  });

  // iOS 上直接给出手动引导
  if (isIOS() && !isStandalone()) showBtn();

  return {
    isStandalone: isStandalone,
    prompt: function () { btn.click(); }
  };
})();

/* ============================================================
   Demo 页面逻辑
   ============================================================ */
(function () {
  'use strict';

  var logBox = document.getElementById('logBox');

  window.__bgLog = function (msg, type) {
    var el = document.createElement('div');
    el.className = 'l' + (type ? ' ' + type : '');
    var d = new Date();
    el.textContent = '[' + String(d.getHours()).padStart(2, '0') + ':' +
                     String(d.getMinutes()).padStart(2, '0') + ':' +
                     String(d.getSeconds()).padStart(2, '0') + '] ' + msg;
    logBox.appendChild(el);
    logBox.scrollTop = logBox.scrollHeight;
  };

  window.__bgListChanged = function (list) {
    var box = document.getElementById('taskList');
    if (!list.length) {
      box.innerHTML = '<div style="color:var(--text3);text-align:center;padding:10px 0;">暂无任务</div>';
      return;
    }
    box.innerHTML = list.map(function (t) {
      var left = Math.max(0, Math.round((t.fireAt - Date.now()) / 1000));
      return '<div class="item">' +
        '<div style="min-width:0;">' +
          '<div style="font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + t.title + '</div>' +
          '<div style="font-size:11.5px;">' + (t.body || '（无内容）') + '</div>' +
        '</div>' +
        '<div style="text-align:right;flex-shrink:0;">' +
          '<div style="font-size:12px;color:var(--blue);">' + left + 's</div>' +
          '<button class="btn danger" style="width:auto;padding:3px 8px;font-size:11px;margin-top:4px;" data-cancel="' + t.id + '">取消</button>' +
        '</div>' +
      '</div>';
    }).join('');

    box.querySelectorAll('[data-cancel]').forEach(function (b) {
      b.addEventListener('click', function () { BgNotify.cancel(b.dataset.cancel); });
    });
  };

  function refreshStatus() {
    var swDot = document.getElementById('dotSW');
    var swTxt = document.getElementById('txtSW');
    if (BgNotify.isReady()) {
      swDot.className = 'dot on';
      swTxt.textContent = 'Service Worker: 已注册';
    } else {
      swDot.className = 'dot off';
      swTxt.textContent = 'Service Worker: 未注册（需 HTTPS）';
    }

    var perm = BgNotify.permission();
    var pDot = document.getElementById('dotPerm');
    var pTxt = document.getElementById('txtPerm');
    if (perm === 'granted') { pDot.className = 'dot on'; pTxt.textContent = '通知权限: 已授权'; }
    else if (perm === 'denied') { pDot.className = 'dot off'; pTxt.textContent = '通知权限: 已拒绝'; }
    else { pDot.className = 'dot'; pTxt.textContent = '通知权限: ' + perm; }

    var kDot = document.getElementById('dotKeep');
    var kTxt = document.getElementById('txtKeep');
    if (KeepAlive.isAudioOn()) { kDot.className = 'dot on'; kTxt.textContent = '静音保活: 开启'; }
    else { kDot.className = 'dot'; kTxt.textContent = '静音保活: 关闭'; }

    var vDot = document.getElementById('dotVis');
    var vTxt = document.getElementById('txtVis');
    if (document.visibilityState === 'visible') {
      vDot.className = 'dot on'; vTxt.textContent = '页面状态: 可见（前台）';
    } else {
      vDot.className = 'dot off'; vTxt.textContent = '页面状态: 隐藏（后台）';
    }
  }

  // 初始化
  (async function () {
    await BgNotify.init();
    refreshStatus();
    window.__bgListChanged(BgNotify.getTasks());

    // 监听 SW 触发
    BgNotify.onFire(function (task) {
      if (task.__type === 'click') {
        window.__bgLog('[app] 通知被点击: ' + JSON.stringify(task.data), 'ok');
        return;
      }
      window.__bgLog('[app] 任务触发: ' + task.id, 'ok');
      // 这里写你的业务逻辑：比如把「对方回复」追加到聊天记录
      refreshStatus();
    });

    setInterval(refreshStatus, 1000);

    // 页面刷新时，把过期的任务提示一下
    document.getElementById('btnRequestPerm').addEventListener('click', async function () {
      var p = await BgNotify.requestPermission();
      window.__bgLog('[app] 通知权限: ' + p, p === 'granted' ? 'ok' : 'err');
      refreshStatus();
    });

    document.getElementById('btnSchedule').addEventListener('click', function () {
      var sec = parseFloat(document.getElementById('delaySec').value) || 10;
      var title = document.getElementById('titleInput').value.trim() || '传讯';
      var body = document.getElementById('bodyInput').value.trim();
      BgNotify.schedule({
        delay: Math.round(sec * 1000),
        title: title,
        body: body,
        tag: 'demo',
        url: location.href,
        payload: { kind: 'demo' }
      });
      window.__bgLog('[app] 已调度，' + sec + ' 秒后触发');
    });

    document.getElementById('btnSchedule5').addEventListener('click', function () {
      BgNotify.schedule({
        delay: 5 * 60 * 1000,
        title: '传讯',
        body: '5 分钟到了，这是一条后台通知',
        tag: 'demo5',
        url: location.href
      });
      window.__bgLog('[app] 已调度 5 分钟任务');
    });

    var swKeep = document.getElementById('swKeep');
    swKeep.addEventListener('click', async function () {
      if (KeepAlive.isAudioOn()) {
        KeepAlive.stopAudio();
        swKeep.classList.remove('on');
        window.__bgLog('[app] 静音保活已关闭');
      } else {
        var ok = await KeepAlive.startAudio();
        swKeep.classList.toggle('on', ok);
        window.__bgLog('[app] 静音保活 ' + (ok ? '已开启' : '开启失败'), ok ? 'ok' : 'err');
      }
      refreshStatus();
    });

    var swWake = document.getElementById('swWake');
    swWake.addEventListener('click', async function () {
      var on = swWake.classList.toggle('on');
      KeepAlive.setWakeWanted(on);
      window.__bgLog('[app] Wake Lock ' + (on ? '请求中' : '已关闭'));
    });

    document.getElementById('btnPing').addEventListener('click', function () {
      BgNotify.ping();
    });

    document.getElementById('btnClearLog').addEventListener('click', function () {
      logBox.innerHTML = '';
    });
  })();

})();
</script>
