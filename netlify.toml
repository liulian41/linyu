[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "zisi"

[[redirects]]
  from = "/ncm/*"
  to = "/.netlify/functions/ncm/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/ncm/health"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
