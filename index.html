function openFriendManager(){
  const friends = DB.friends();
  const listHTML = friends.length
    ? '<div class="picker-list">' + friends.map(f =>
        '<div class="list-item" data-fid="' + f.id + '">' +
          avatarHTML(f.avatar, f.name, 40) +
          '<div class="li-main"><div class="li-name">' + esc(f.name) + '</div>' +
            '<div class="li-sub">' + (DB.chat(f.id).length) + ' 条消息</div></div>' +
          '<button class="icon-btn" data-edit="' + f.id + '" style="width:32px;height:32px;color:var(--text-secondary);">' + icon('edit', 17) + '</button>' +
          '<button class="icon-btn" data-del="' + f.id + '" style="width:32px;height:32px;color:var(--danger);">' + icon('trash', 17) + '</button>' +
        '</div>'
      ).join('') + '</div>'
    : '<div style="padding:26px 0;text-align:center;font-size:13px;color:var(--text-tertiary);">还没有好友</div>';
  const m = openModal({
    title: '好友管理', bodyHTML: listHTML,
    actions: [
      { text: '关闭' },
      { text: '新增好友', primary: true, onClick: () => { setTimeout(openFriendEditor, 200); } }
    ], bottom: true
  });
  m.mask.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const f = DB.friends().find(x => x.id === btn.dataset.edit);
      if (f) { m.close(); setTimeout(() => openFriendEditor(f), 200); }
    });
  });
  m.mask.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const fid = btn.dataset.del;
      const f = DB.friends().find(x => x.id === fid);
      confirmBox('删除好友', '将删除「' + (f ? f.name : '') + '」及其聊天记录。', () => {
        const list = DB.friends().filter(x => x.id !== fid);
        DB.setFriends(list);
        S.del('chat_' + fid);
        if (state.currentFriendId === fid){
          state.currentFriendId = list[0] ? list[0].id : null;
          DB.setCurrentFriend(state.currentFriendId);
          clearQuote();
        }
        m.close(); setTimeout(openFriendManager, 200);
        renderMe(); renderChat(); toast('已删除');
      }, '删除', true);
    });
  });
}

function openFriendEditor(friend){
  const isEdit = !!friend;
  let avatar = friend ? (friend.avatar || '') : '';
  const body =
    '<div style="display:flex;justify-content:center;margin-bottom:16px;">' +
      '<label style="cursor:pointer;">' +
        '<span id="fAvatarPreview">' + avatarHTML(avatar, friend ? friend.name : '?', 72) + '</span>' +
        '<input type="file" id="fAvatarInput" accept="image/*" style="display:none;"></label></div>' +
    '<div class="field"><label>好友昵称</label>' +
      '<input type="text" id="fName" value="' + esc(friend ? friend.name : '') + '" placeholder="输入昵称"></div>';
  const m = openModal({
    title: isEdit ? '编辑好友' : '新增好友', bodyHTML: body,
    actions: [
      { text: '取消' },
      { text: '保存', primary: true, onClick: (mask) => {
          const name = mask.querySelector('#fName').value.trim();
          if (!name){ toast('请填写昵称'); return false; }
          const list = DB.friends();
          if (isEdit){
            const f = list.find(x => x.id === friend.id);
            if (f){ f.name = name; f.avatar = avatar; }
            DB.setFriends(list); renderChat();
          } else {
            const nf = { id: uid(), name, avatar };
            list.push(nf); DB.setFriends(list);
            if (!state.currentFriendId){
              state.currentFriendId = nf.id; DB.setCurrentFriend(nf.id);
            }
          }
          renderMe(); renderChat();
          setTimeout(openFriendManager, 200);
          toast(isEdit ? '已更新' : '已添加');
        } }
    ], bottom: true
  });
  const input = m.mask.querySelector('#fAvatarInput');
  input.addEventListener('change', async () => {
    const f = input.files && input.files[0];
    if (!f) return;
    try{
      avatar = await compressImage(f, 320, 0.8);
      m.mask.querySelector('#fAvatarPreview').innerHTML = avatarHTML(avatar, '', 72);
    }catch(e){ toast('头像读取失败'); }
  });
}

function openCardLibrary(){
  const groups = DB.groups();
  const stickers = DB.stickers();
  const body =
    '<div style="display:flex;gap:10px;margin-bottom:14px;">' +
      '<button class="btn ghost" id="tabGrpBtn" style="flex:1;">文本库</button>' +
      '<button class="btn ghost" id="tabStkBtn" style="flex:1;">表情包</button></div>' +
    '<div id="cardLibBody">' + cardLibHTML(groups) + '</div>' +
    '<div id="stickerLibBody" style="display:none;">' + stickerLibHTML(stickers) + '</div>';
  const m = openModal({ title: '内容管理', bodyHTML: body, actions: [{ text: '关闭', primary: true }], bottom: true });
  const tabGrp = m.mask.querySelector('#tabGrpBtn');
  const tabStk = m.mask.querySelector('#tabStkBtn');
  const bodyGrp = m.mask.querySelector('#cardLibBody');
  const bodyStk = m.mask.querySelector('#stickerLibBody');

  tabGrp.addEventListener('click', () => {
    tabGrp.classList.add('btn'); tabStk.classList.remove('btn');
    bodyGrp.style.display = 'block'; bodyStk.style.display = 'none';
  });
  tabStk.addEventListener('click', () => {
    tabStk.classList.add('btn'); tabGrp.classList.remove('btn');
    bodyStk.style.display = 'block'; bodyGrp.style.display = 'none';
  });

  function refreshGrp(){ bodyGrp.innerHTML = cardLibHTML(DB.groups()); bindGrp(); }
  function refreshStk(){ bodyStk.innerHTML = stickerLibHTML(DB.stickers()); bindStk(); renderStickerPanel(); }

  function bindGrp(){
    m.mask.querySelectorAll('[data-toggle-group]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const gid = btn.dataset.toggleGroup;
        const groups = DB.groups();
        const g = groups.find(x => x.id === gid);
        if (!g) return;
        g.disabled = !g.disabled;
        DB.setGroups(groups);
        refreshGrp();
      });
    });

    m.mask.querySelectorAll('[data-add-card]').forEach(btn => {
      btn.addEventListener('click', () => {
        const gid = btn.dataset.addCard;
        const input = m.mask.querySelector('[data-card-input="' + gid + '"]');
        const text = (input ? input.value : '').trim();
        if (!text){ toast('请输入内容'); return; }
        const groups = DB.groups();
        const g = groups.find(x => x.id === gid);
        if (!g) return;
        g.cards = g.cards || [];
        if (g.cards.includes(text)){ toast('该文本已存在，已跳过'); return; }
        g.cards.push(text);
        DB.setGroups(groups);
        refreshGrp(); renderMe();
        toast('已添加');
      });
    });
    m.mask.querySelectorAll('[data-del-card]').forEach(btn => {
      btn.addEventListener('click', () => {
        const gid = btn.dataset.gid;
        const idx = parseInt(btn.dataset.delCard, 10);
        const groups = DB.groups();
        const g = groups.find(x => x.id === gid);
        if (!g) return;
        g.cards.splice(idx, 1);
        DB.setGroups(groups);
        refreshGrp(); renderMe();
      });
    });
    m.mask.querySelectorAll('[data-del-group]').forEach(btn => {
      btn.addEventListener('click', () => {
        const gid = btn.dataset.delGroup;
        confirmBox('删除分组', '该分组下的所有文本将一并删除。', () => {
          const groups = DB.groups().filter(x => x.id !== gid);
          DB.setGroups(groups);
          refreshGrp(); renderMe(); toast('分组已删除');
        }, '删除', true);
      });
    });
    m.mask.querySelectorAll('[data-rename-group]').forEach(btn => {
      btn.addEventListener('click', () => {
        const gid = btn.dataset.renameGroup;
        const groups = DB.groups();
        const g = groups.find(x => x.id === gid);
        if (!g) return;
        openModal({
          title: '重命名分组',
          bodyHTML: '<div class="field"><label>分组名称</label><input type="text" id="gname" value="' + esc(g.name) + '"></div>',
          actions: [
            { text: '取消' },
            { text: '保存', primary: true, onClick: (mm) => {
                const v = mm.querySelector('#gname').value.trim();
                if (!v){ toast('名称不能为空'); return false; }
                g.name = v; DB.setGroups(groups); refreshGrp(); renderMe();
                toast('已重命名');
              } }
          ]
        });
      });
    });
  }

  m.mask.querySelector('#btnAddGroup')?.addEventListener('click', () => {
    openModal({
      title: '新增分组',
      bodyHTML: '<div class="field"><label>分组名称</label><input type="text" id="ngname" placeholder="例如：日常回复"></div>',
      actions: [
        { text: '取消' },
        { text: '创建', primary: true, onClick: (mm) => {
            const v = mm.querySelector('#ngname').value.trim();
            if (!v){ toast('名称不能为空'); return false; }
            const groups = DB.groups();
            if (groups.some(g => g.name === v)){ toast('分组已存在'); return false; }
            groups.push({ id: uid(), name: v, cards: [], disabled: false });
            DB.setGroups(groups);
            refreshGrp(); renderMe(); toast('分组已创建');
          } }
      ]
    });
  });

  m.mask.querySelector('#btnBulkAdd')?.addEventListener('click', () => {
    const groups = DB.groups();
    if (!groups.length){ toast('请先创建一个分组'); return; }
    openModal({
      title: '批量粘贴文本',
      bodyHTML:
        '<div class="field"><label>目标分组</label>' +
          '<select id="bulkGroup" style="width:100%;padding:11px 14px;border-radius:12px;border:.5px solid var(--sep);background:var(--fill-1);color:var(--text);font-size:15px;font-family:inherit;outline:none;">' +
            groups.map(g => '<option value="' + g.id + '">' + esc(g.name) + '</option>').join('') +
          '</select></div>' +
        '<div class="field"><label>文本内容（每行一条）</label>' +
          '<textarea id="bulkText" rows="7" placeholder="每行一条文本，重复内容会自动跳过"></textarea></div>',
      actions: [
        { text: '取消' },
        { text: '导入', primary: true, onClick: (mm) => {
            const gid = mm.querySelector('#bulkGroup').value;
            const raw = mm.querySelector('#bulkText').value;
            const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            if (!lines.length){ toast('没有可导入的内容'); return false; }
            const groups2 = DB.groups();
            const g = groups2.find(x => x.id === gid);
            if (!g) return false;
            g.cards = g.cards || [];
            const set = new Set(g.cards);
            let added = 0, dup = 0;
            lines.forEach(line => {
              if (set.has(line)) { dup++; return; }
              set.add(line); g.cards.push(line); added++;
            });
            DB.setGroups(groups2);
            refreshGrp(); renderMe();
            toast('新增 ' + added + ' 条' + (dup ? '，已跳过重复 ' + dup + ' 条' : ''));
          } }
      ], bottom: true
    });
  });

  function bindStk(){
    m.mask.querySelectorAll('[data-del-sticker]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.delSticker, 10);
        const stickers = DB.stickers();
        stickers.splice(idx, 1);
        DB.setStickers(stickers);
        refreshStk(); renderMe();
      });
    });
    m.mask.querySelector('#btnBulkSticker')?.addEventListener('click', () => {
      openModal({
        title: '批量导入表情',
        bodyHTML:
          '<div class="field"><label>粘贴内容（支持 备注：链接 格式）</label>' +
            '<textarea id="bulkStk" rows="7" placeholder="例如：\n开心：https://xxx.com/a.gif\n无语：https://xxx.com/b.png"></textarea>' +
            '<div class="hint">每行一个，按冒号拆分备注和图片直链。</div></div>',
        actions: [
          { text: '取消' },
          { text: '导入', primary: true, onClick: (mm) => {
              const raw = mm.querySelector('#bulkStk').value;
              const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
              if (!lines.length){ toast('没有可导入的内容'); return false; }
              const stickers = DB.stickers();
              let added = 0;
              lines.forEach((line, i) => {
                let name = '表情 ' + (stickers.length + added + 1);
                let url = line;
                const match = line.match(/^([^：:]+)[：:](.+)$/);
                if (match) { name = match[1].trim(); url = match[2].trim(); }
                if (url.startsWith('http')) { stickers.push({ id: uid(), name, url }); added++; }
              });
              DB.setStickers(stickers);
              refreshStk(); renderMe();
              toast('成功导入 ' + added + ' 个表情');
            } }
        ]
      });
    });
    m.mask.querySelector('#btnAddStickerLink')?.addEventListener('click', () => {
      openModal({
        title: '添加链接表情',
        bodyHTML:
          '<div class="field"><label>备注</label><input type="text" id="stkName" placeholder="例如：开心"></div>' +
          '<div class="field"><label>图片链接</label><input type="text" id="stkUrl" placeholder="https://..."></div>',
        actions: [
          { text: '取消' },
          { text: '保存', primary: true, onClick: (mm) => {
              const name = mm.querySelector('#stkName').value.trim() || '表情';
              const url = mm.querySelector('#stkUrl').value.trim();
              if (!url.startsWith('http')){ toast('请输入正确的图片链接'); return false; }
              const stickers = DB.stickers();
              stickers.push({ id: uid(), name, url });
              DB.setStickers(stickers);
              refreshStk(); renderMe(); toast('已添加');
            } }
        ]
      });
    });
    m.mask.querySelector('#btnAddStickerFile')?.addEventListener('click', () => {
      const fi = document.createElement('input');
      fi.type = 'file'; fi.accept = 'image/*';
      fi.onchange = async () => {
        const file = fi.files && fi.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) { toast('本地图片请尽量小于 2MB'); return; }
        try {
          const base64 = await compressImage(file, 300, 0.8);
          const stickers = DB.stickers();
          stickers.push({ id: uid(), name: file.name.split('.')[0], url: base64 });
          DB.setStickers(stickers);
          refreshStk(); renderMe(); toast('本地表情已添加');
        } catch(e) { toast('图片处理失败'); }
      };
      fi.click();
    });
  }

  bindGrp();
  bindStk();
}

function cardLibHTML(groups){
  if (!groups.length){
    return '<div style="padding:26px 0;text-align:center;font-size:13px;color:var(--text-tertiary);line-height:1.7;">文本库为空<br>系统不预置任何字卡，请先创建分组并添加内容</div>' +
           '<div style="display:flex;gap:10px;margin-top:14px;">' +
             '<button class="btn ghost" id="btnAddGroup" style="display:flex;align-items:center;justify-content:center;gap:6px;">' + icon('folder', 16) + '新增分组</button></div>';
  }
  return groups.map(g => {
    const cards = g.cards || [];
    const disabled = g.disabled;
    return '<div style="margin-bottom:16px;border:.5px solid var(--sep);border-radius:14px;padding:12px;' + (disabled ? 'opacity:0.6;background:var(--fill-1);' : '') + '">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
        '<span style="flex:1;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;">' + esc(g.name) + ' <span style="color:var(--text-tertiary);font-weight:400;font-size:12px;">(' + cards.length + ')</span>' +
        (disabled ? '<span style="color:var(--danger);font-size:11px;font-weight:400;">(已屏蔽)</span>' : '') + '</span>' +
        '<button class="switch ' + (disabled ? '' : 'on') + '" data-toggle-group="' + g.id + '" style="transform:scale(0.6);transform-origin:right center;margin-right:-4px;"></button>' +
        '<button class="icon-btn" data-rename-group="' + g.id + '" style="width:28px;height:28px;color:var(--text-secondary);">' + icon('edit', 15) + '</button>' +
        '<button class="icon-btn" data-del-group="' + g.id + '" style="width:28px;height:28px;color:var(--danger);">' + icon('trash', 15) + '</button>' +
      '</div>' +
      (cards.length
        ? cards.map((c, i) =>
            '<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:.5px solid var(--sep);">' +
              '<span style="flex:1;font-size:13.5px;line-height:1.45;word-break:break-word;">' + esc(c) + '</span>' +
              '<button class="icon-btn" data-del-card="' + i + '" data-gid="' + g.id + '" style="width:26px;height:26px;color:var(--text-tertiary);flex-shrink:0;">' + icon('close', 14) + '</button>' +
            '</div>').join('')
        : '<div style="font-size:12.5px;color:var(--text-tertiary);padding:6px 0;">暂无文本</div>') +
      '<div style="display:flex;gap:8px;margin-top:10px;">' +
        '<input type="text" data-card-input="' + g.id + '" placeholder="新增一条文本" style="flex:1;padding:9px 12px;border-radius:10px;border:.5px solid var(--sep);background:var(--fill-1);color:var(--text);font-size:13.5px;outline:none;font-family:inherit;">' +
        '<button class="btn" data-add-card="' + g.id + '" style="width:auto;padding:9px 16px;font-size:13px;border-radius:10px;">添加</button>' +
      '</div></div>';
  }).join('') +
  '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button class="btn ghost" id="btnAddGroup" style="display:flex;align-items:center;justify-content:center;gap:6px;">' + icon('folder', 16) + '新增分组</button>' +
    '<button class="btn ghost" id="btnBulkAdd" style="display:flex;align-items:center;justify-content:center;gap:6px;">' + icon('doc', 16) + '批量粘贴</button>' +
  '</div>';
}

function stickerLibHTML(stickers){
  const grid = stickers.length
    ? '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">' +
        stickers.map((s, i) =>
          '<div style="position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--fill-1);border:.5px solid var(--sep);display:flex;flex-direction:column;align-items:center;justify-content:center;">' +
            '<img src="' + esc(s.url) + '" style="max-width:100%;max-height:80%;object-fit:contain;" alt="">' +
            '<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center;">' + esc(s.name) + '</div>' +
            '<button class="icon-btn" data-del-sticker="' + i + '" style="position:absolute;top:2px;right:2px;width:24px;height:24px;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(4px);">' + icon('close', 12) + '</button>' +
          '</div>'
        ).join('') + '</div>'
    : '<div style="padding:26px 0;text-align:center;font-size:13px;color:var(--text-tertiary);">暂无表情包</div>';
  return grid +
    '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
      '<button class="btn ghost" id="btnBulkSticker" style="flex:1;padding:10px;font-size:13px;">批量导入</button>' +
      '<button class="btn ghost" id="btnAddStickerLink" style="flex:1;padding:10px;font-size:13px;">单条链接</button>' +
      '<button class="btn ghost" id="btnAddStickerFile" style="flex:1;padding:10px;font-size:13px;">本地上传</button>' +
    '</div>';
}

function renderStickerPanel(){
  const grid = $('#stickerGrid');
  if (!grid) return;
  grid.style.display = '';
  const stickers = DB.stickers();
  if (!stickers.length){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;font-size:13px;color:var(--text-tertiary);padding:20px 0;">暂无表情包<br>请前往「我的」添加</div>';
    return;
  }
  grid.innerHTML = stickers.map(s =>
    '<div class="sticker-item" data-url="' + esc(s.url) + '">' +
      '<div class="img-box"><img src="' + esc(s.url) + '" alt="' + esc(s.name) + '"></div>' +
      '<span>' + esc(s.name) + '</span>' +
    '</div>'
  ).join('');
  grid.querySelectorAll('[data-url]').forEach(el => {
    el.addEventListener('click', () => {
      const url = el.dataset.url;
      $('#stickerPanel').classList.remove('show');
      $('#toolPanel').classList.remove('show');
      $('#btnToggleTool').classList.remove('active');
      sendMessage(true, url);
    });
  });
}

function exportData(){
  const data = {};
  S.allKeys().forEach(k => { data[k] = localStorage.getItem(k); });
  const payload = { app: 'chuanxun', version: 3.5, exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chuanxun-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('已导出（不含本地音频文件）');
}

function importData(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json'; input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const obj = JSON.parse(reader.result);
        if (!obj || obj.app !== 'chuanxun' || !obj.data) throw new Error('格式不正确');
        confirmBox('导入数据', '将覆盖当前全部本地数据并刷新页面。', () => {
          S.allKeys().forEach(k => localStorage.removeItem(k));
          Object.keys(obj.data).forEach(k => {
            if (k.startsWith('cx_')) localStorage.setItem(k, obj.data[k]);
          });
          location.reload();
        }, '导入', true);
      }catch(e){ toast('导入失败：文件格式不正确'); }
    };
    reader.readAsText(file);
  });
  input.click();
}

function clearAllData(){
  confirmBox('清除全部本地数据',
    '将清空聊天记录、好友、歌单、朋友圈、文本库、商城数据与全部设置。此操作不可撤销。',
    () => {
      S.allKeys().forEach(k => localStorage.removeItem(k));
      try{
        if (_audioDB){ _audioDB.close(); _audioDB = null; }
        indexedDB.deleteDatabase('chuanxun_audio');
      }catch(e){}
      setTimeout(() => location.reload(), 300);
    }, '清除', true);
}

function openAbout(){
  openModal({
    title: '关于传讯',
    bodyHTML:
      '<div style="font-size:13.5px;line-height:1.75;color:var(--text-secondary);">' +
        '<p style="margin:0 0 12px;">传讯 3.5：修复歌手未知问题，新增心愿单中心，支持双向心愿互动与许愿实现。</p>' +
        '<p style="margin:0 0 12px;">所有数据仅保存在本机浏览器。</p>' +
      '</div>',
    actions: [{ text: '关闭', primary: true }]
  });
}

function bindGlobal(){
  $$('.tab-item').forEach(t => { t.addEventListener('click', () => switchTab(t.dataset.tab)); });
  $$('.tab-item [data-icon]').forEach(span => {
    const map = { message: 'message', wave: 'wave', camera: 'camera', shop: 'shop', user: 'user' };
    span.innerHTML = icon(map[span.dataset.icon] || 'message', 23);
  });

  $('#btnFriendPicker').innerHTML = icon('swap', 21);
  $('#btnFriendPicker').addEventListener('click', openFriendPicker);

  $('#btnCall').innerHTML = icon('phone', 21);
  $('#btnCall').addEventListener('click', () => { if (!getCurrentFriend()) return; Call.startOutgoing(); });
  attachLongPress($('#btnCall'), () => { if (!getCurrentFriend()) return; Call.simulateIncoming(); });

  $('#btnChatSettings').innerHTML = icon('sliders', 21);
  $('#btnChatSettings').addEventListener('click', openChatSettings);

  $('#btnClearChat').innerHTML = icon('trash', 20);
  $('#btnClearChat').addEventListener('click', clearCurrentChat);

  $('#chatTitle').addEventListener('click', () => {
    const f = getCurrentFriend();
    if (f) openFriendEditor(f); else openFriendPicker();
  });

  const input = $('#msgInput');
  const sendBtn = $('#btnSend');
  sendBtn.innerHTML = icon('arrowUp', 19);

  input.addEventListener('input', () => {
    autoResizeInput();
    sendBtn.disabled = !input.value.trim() || !getCurrentFriend();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage(false);
    }
  });
  input.addEventListener('focus', () => {
    $('#stickerPanel').classList.remove('show');
    $('#toolPanel').classList.remove('show');
    $('#btnToggleTool').classList.remove('active');
    setTimeout(scrollToBottom, 300);
  });

  sendBtn.addEventListener('click', () => { if (!sendBtn.disabled) sendMessage(false); });

  $('#qpClose').innerHTML = icon('close', 14);
  $('#qpClose').addEventListener('click', clearQuote);

  $('#btnToggleTool').innerHTML = icon('plus', 24);
  $('#btnToggleTool').addEventListener('click', () => {
    const tp = $('#toolPanel');
    const sp = $('#stickerPanel');
    if (tp.classList.contains('show') || sp.classList.contains('show')){
      tp.classList.remove('show'); sp.classList.remove('show');
      $('#btnToggleTool').classList.remove('active');
    } else {
      tp.classList.add('show'); sp.classList.remove('show');
      $('#btnToggleTool').classList.add('active');
      setTimeout(scrollToBottom, 300);
    }
  });

  $('#icoRedPacket').innerHTML = icon('gift', 28);
  $('#icoSticker').innerHTML = icon('smile', 28);
  $('#icoShareMusic').innerHTML = icon('music', 28);

  $('#btnToolRedPacket').addEventListener('click', () => {
    $('#toolPanel').classList.remove('show');
    $('#btnToggleTool').classList.remove('active');
    openSendRedPacketModal();
  });

  $('#btnToolSticker').addEventListener('click', () => {
    $('#toolPanel').classList.remove('show');
    $('#stickerPanel').classList.add('show');
    $('#btnToggleTool').classList.add('active');
    renderStickerPanel();
    setTimeout(scrollToBottom, 300);
  });

  $('#btnToolShareMusic').addEventListener('click', () => {
    $('#toolPanel').classList.remove('show');
    $('#btnToggleTool').classList.remove('active');
    openShareMusicModal();
  });

  $('#btnQuickAddSticker').addEventListener('click', () => {
    switchTab('me');
    setTimeout(() => openCardLibrary(), 300);
  });

  $('#btnInvite').innerHTML = icon('personPlus', 21);
  $('#btnInvite').addEventListener('click', inviteToListen);

  $('#btnPost').innerHTML = icon('plus', 22);
  $('#btnPost').addEventListener('click', openPostMoment);

  const st = DB.settings();
  document.body.classList.toggle('no-anim', !st.anim);

  // 信箱相关按钮
  $('#btnCloseLetter').innerHTML = icon('chevronLeft', 24);
  $('#btnCloseLetter').addEventListener('click', () => {
      $('#letterScreen').classList.remove('show');
  });
  $('#btnWriteLetter').innerHTML = icon('pen', 20);
  $('#btnWriteLetter').addEventListener('click', () => openWriteLetter());
  
  // 商城购物车和添加商品
  $('#btnOpenCart').innerHTML = icon('cart', 22);
  $('#btnOpenCart').addEventListener('click', openCartModal);
  $('#btnAddProduct').innerHTML = icon('plus', 22);
  $('#btnAddProduct').addEventListener('click', openAddProductModal);
  $('#btnViewWishlist').innerHTML = icon('wish', 22);
  $('#btnViewWishlist').addEventListener('click', openWishlist);

  // 全局监听切回前台，检查是否有过期未执行的自动回复
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.replyFireAt) {
       if (Date.now() >= state.replyFireAt) {
          clearTimeout(state.replyTimer);
          state.replyTimer = null;
          const f = DB.friends().find(x => x.id === state.replyFriendId);
          if (f) {
            state.replyFireAt = 0;
            state.replyFriendId = null;
            state.typingTimer = null;
            hideTypingIndicator();
            triggerAutoReply(f);
          }
       }
    }
  });

  // 添加到主屏幕
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__deferredInstallPrompt = e;
    if (state.tab === 'me') renderMe();
  });
}

function init(){
  applyTheme(DB.theme());
  const friends = DB.friends();
  if (state.currentFriendId && !friends.some(f => f.id === state.currentFriendId)){
    state.currentFriendId = friends[0] ? friends[0].id : null;
    DB.setCurrentFriend(state.currentFriendId);
  }
  if (!state.currentFriendId && friends.length){
    state.currentFriendId = friends[0].id;
    DB.setCurrentFriend(state.currentFriendId);
  }

  BgNotify.init();

  bindGlobal();
  Player.init();
  renderChat();
  renderMe();
  renderShop();
  updateLetterBadge();

  setInterval(checkAutoLetter, 30000);
  setInterval(autoSimulateShop, 45000);

  setTimeout(() => {
    const splash = $('#splash');
    if (splash){ splash.classList.add('hide'); setTimeout(() => splash.remove(), 560); }
  }, 1200);

  window.addEventListener('resize', () => {
    const mini = document.getElementById('callMini');
    if (!mini) return;
    const r = mini.getBoundingClientRect();
    const margin = 8;
    const left = clamp(r.left, margin, Math.max(margin, window.innerWidth - r.width - margin));
    const top = clamp(r.top, margin, Math.max(margin, window.innerHeight - r.height - margin));
    mini.style.left = left + 'px';
    mini.style.top = top + 'px';
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
