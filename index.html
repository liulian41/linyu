        ${o.action === 'req_pay' && o.from === 'other' && o.status === 'pending' ? 
          `<div style="display:flex;gap:8px;margin-top:10px;">
             <button class="btn danger" style="font-size:12px;padding:6px;" data-reject-order="${o.id}">拒绝</button>
             <button class="btn primary" style="font-size:12px;padding:6px;" data-pay-order="${o.id}">代付</button>
           </div>` : ''}
      </div>
    </div>
  `).join('') : '<div style="text-align:center;font-size:12px;color:var(--text-tertiary);padding:10px;">暂无动态</div>';
  
  $('#shopOrders').innerHTML = orderHTML;
  $('#orderCount').textContent = orders.length;
  
  // 绑定折叠面板
  const orderToggle = $('#toggleOrdersPanel');
  const orderList = $('#shopOrders');
  const orderChev = $('#orderChev');
  if (orderToggle) {
    orderChev.innerHTML = icon('chevronRight', 18);
    orderToggle.onclick = () => {
      if (orderList.style.display === 'none') {
        orderList.style.display = 'block';
        orderChev.style.transform = 'rotate(90deg)';
      } else {
        orderList.style.display = 'none';
        orderChev.style.transform = 'rotate(0deg)';
      }
    };
  }
  
  const products = DB.products();
  const grid = $('#shopGrid');
  grid.innerHTML = products.map(p => `
    <div class="shop-item">
      <button class="icon-btn" style="position:absolute;top:4px;right:4px;color:var(--text-tertiary);width:24px;height:24px;z-index:10;background:rgba(255,255,255,0.8);border-radius:50%;" data-del-product="${p.id}">${icon('close', 14)}</button>
      <div class="shop-img" style="background:${p.color || '#eee'}20;color:${p.color || '#333'};font-size:48px;">${p.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${esc(p.name)}</div>
        <div class="shop-price">¥${p.price.toFixed(2)}</div>
        <div class="shop-actions">
          <button class="shop-btn" data-add-cart="${p.id}">加购物车</button>
          <button class="shop-btn primary" data-buy="${p.id}">购买</button>
        </div>
        <div class="shop-actions">
          <button class="shop-btn" data-wish="${p.id}">许愿</button>
          <button class="shop-btn" data-req-pay="${p.id}">让对方代付</button>
        </div>
      </div>
    </div>
  `).join('');
  
  // 修复重复绑定的问题：使用 onclick 或者先移除旧监听。直接赋值最保险。
  $('#btnEditUserWallet').onclick = () => editWallet('user');
  $('#btnEditFriendWallet').onclick = () => editWallet('friend');
  
  grid.querySelectorAll('[data-add-cart]').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.addCart));
  });
  grid.querySelectorAll('[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => buyProduct(btn.dataset.buy));
  });
  grid.querySelectorAll('[data-wish]').forEach(btn => {
    btn.addEventListener('click', () => wishProduct(btn.dataset.wish));
  });
  grid.querySelectorAll('[data-req-pay]').forEach(btn => {
    btn.addEventListener('click', () => reqPayProduct(btn.dataset.reqPay));
  });
  grid.querySelectorAll('[data-del-product]').forEach(btn => {
    btn.addEventListener('click', (e) => {
       e.stopPropagation();
       const pid = btn.dataset.delProduct;
       const prods = DB.products().filter(x => x.id !== pid);
       DB.setProducts(prods);
       renderShop();
       toast('已删除商品');
    });
  });
  
  $$('#shopOrders [data-pay-order]').forEach(btn => {
    btn.addEventListener('click', () => {
      const orderId = btn.dataset.payOrder;
      const orders = DB.orders();
      const order = orders.find(x => x.id === orderId);
      if (!order) return;
      
      if (DB.userWallet() < order.price) { toast('您的余额不足，无法代付'); return; }
      
      confirmBox('代付确认', `确定要花费 ¥${order.price} 为对方购买【${order.productName}】吗？`, () => {
        DB.setUserWallet(DB.userWallet() - order.price);
        order.status = 'done';
        DB.setOrders(orders);
        renderShop();
        toast('代付成功');
        
        const p = DB.products().find(x => x.name === order.productName) || { name: order.productName, price: order.price, icon: '🎁' };
        appendMessage({ id: uid(), from: 'me', type: 'gift', giftData: p, ts: Date.now() });
      });
    });
  });
  
  $$('#shopOrders [data-reject-order]').forEach(btn => {
    btn.addEventListener('click', () => {
      const orderId = btn.dataset.rejectOrder;
      const orders = DB.orders();
      const order = orders.find(x => x.id === orderId);
      if (!order) return;
      order.status = 'rejected';
      DB.setOrders(orders);
      renderShop();
      toast('已拒绝代付');
    });
  });
}

function editWallet(target) {
  const isUser = target === 'user';
  const currentVal = isUser ? DB.userWallet() : DB.friendWallet();
  const m = openModal({
    title: isUser ? '修改我的余额' : '修改对方余额',
    bodyHTML: `<div class="field"><label>输入金额</label><input type="number" id="walletInput" value="${currentVal}" step="0.01"></div>`,
    actions: [
      { text: '取消' },
      { text: '保存', primary: true, onClick: (mask) => {
          const val = parseFloat(mask.querySelector('#walletInput').value);
          if (isNaN(val) || val < 0) { toast('请输入有效金额'); return false; }
          if (isUser) DB.setUserWallet(val); else DB.setFriendWallet(val);
          renderShop();
        } }
    ]
  });
}

function addToCart(pid) {
  const product = DB.products().find(p => p.id === pid);
  if (!product) return;
  const cart = DB.cart();
  const exist = cart.find(c => c.pid === pid);
  if (exist) exist.count++;
  else cart.push({ pid, count: 1 });
  DB.setCart(cart);
  toast('已加入购物车');
}

function buyProduct(pid) {
  const product = DB.products().find(p => p.id === pid);
  if (!product) return;
  
  if (DB.userWallet() < product.price) { toast('余额不足'); return; }
  
  openModal({
    title: '选择赠送对象',
    bodyHTML: `<div style="text-align:center;padding:20px 0;font-size:40px;">${product.icon}</div>
               <div style="text-align:center;font-size:16px;font-weight:600;margin-bottom:10px;">${esc(product.name)}</div>
               <div style="text-align:center;color:var(--danger);font-weight:700;">¥${product.price.toFixed(2)}</div>`,
    actions: [
      { text: '取消' },
      { text: '送给自己', onClick: () => {
         DB.setUserWallet(DB.userWallet() - product.price);
         const orders = DB.orders();
         orders.push({ id: uid(), from: 'me', action: 'buy', productName: product.name, price: product.price, ts: Date.now(), status: 'done' });
         DB.setOrders(orders);
         renderShop();
         toast('购买成功');
      } },
      { text: '送给Ta', primary: true, onClick: () => {
         DB.setUserWallet(DB.userWallet() - product.price);
         const orders = DB.orders();
         orders.push({ id: uid(), from: 'me', action: 'buy', productName: product.name, price: product.price, ts: Date.now(), status: 'done' });
         DB.setOrders(orders);
         renderShop();
         appendMessage({ id: uid(), from: 'me', type: 'gift', giftData: product, ts: Date.now() });
         toast('已送出礼物并发送卡片');
      } }
    ]
  });
}

function wishProduct(pid) {
  const product = DB.products().find(p => p.id === pid);
  if (!product) return;
  
  const orders = DB.orders();
  orders.push({
    id: uid(), from: 'me', action: 'wish', productName: product.name, price: product.price, ts: Date.now(), status: 'pending'
  });
  DB.setOrders(orders);
  renderShop();
  toast('许愿成功，等待后续回应');
  
  setTimeout(() => {
    const os = DB.orders();
    const o = os.find(x => x.id === orders[orders.length-1].id);
    if (o && o.status === 'pending') {
       if (Math.random() > 0.3) {
          o.status = 'done';
          DB.setOrders(os);
          if (DB.friendWallet() >= product.price) {
             DB.setFriendWallet(DB.friendWallet() - product.price);
          }
          appendMessage({ id: uid(), from: 'other', type: 'gift', giftData: product, ts: Date.now() });
          if (state.tab === 'shop') renderShop();
          toast('你的心愿被实现了！');
       } else {
          o.status = 'rejected';
          DB.setOrders(os);
          if (state.tab === 'shop') renderShop();
          toast('对方拒绝了你的心愿');
       }
    }
  }, 5000 + Math.random() * 10000);
}

function reqPayProduct(pid) {
  const product = DB.products().find(p => p.id === pid);
  if (!product) return;
  
  const orders = DB.orders();
  const orderId = uid();
  orders.push({
    id: orderId, from: 'me', action: 'req_pay', productName: product.name, price: product.price, ts: Date.now(), status: 'pending'
  });
  DB.setOrders(orders);
  renderShop();
  toast('已发送代付请求');
  
  setTimeout(() => {
    const os = DB.orders();
    const o = os.find(x => x.id === orderId);
    if (o && o.status === 'pending') {
      if (Math.random() > 0.3 && DB.friendWallet() >= o.price) {
        DB.setFriendWallet(DB.friendWallet() - o.price);
        o.status = 'done';
        DB.setOrders(os);
        appendMessage({ id: uid(), from: 'other', type: 'gift', giftData: product, ts: Date.now() });
        if (state.tab === 'shop') renderShop();
        toast('对方已为你代付！');
      } else {
        o.status = 'rejected';
        DB.setOrders(os);
        if (state.tab === 'shop') renderShop();
        toast('对方拒绝了你的代付请求');
      }
    }
  }, 4000 + Math.random()*3000);
}

function openCartModal() {
  const cart = DB.cart();
  if (!cart.length) {
    openModal({ title: '购物车', text: '空空如也', actions: [{ text: '关闭', primary: true }] });
    return;
  }
  
  let total = 0;
  const list = cart.map(c => {
    const p = DB.products().find(x => x.id === c.pid);
    if (!p) return '';
    total += p.price * c.count;
    return `
      <div class="list-item">
        <div class="li-main">
          <div class="li-name">${p.icon} ${esc(p.name)}</div>
          <div class="li-sub">¥${p.price.toFixed(2)} x ${c.count}</div>
        </div>
        <button class="icon-btn" data-del-cart="${p.id}" style="color:var(--danger);width:28px;height:28px;">${icon('trash', 16)}</button>
      </div>
    `;
  }).join('');
  
  const body = `
    <div style="max-height:40vh;overflow-y:auto;">${list}</div>
    <div style="text-align:right;font-size:16px;font-weight:700;margin-top:14px;color:var(--danger);">总计: ¥${total.toFixed(2)}</div>
  `;
  
  const m = openModal({
    title: '购物车',
    bodyHTML: body,
    actions: [
      { text: '清空', danger: true, onClick: () => { DB.setCart([]); toast('已清空'); } },
      { text: '去结算', primary: true, onClick: () => {
          if (DB.userWallet() < total) { toast('余额不足'); return false; }
          DB.setUserWallet(DB.userWallet() - total);
          
          const orders = DB.orders();
          cart.forEach(c => {
             const p = DB.products().find(x => x.id === c.pid);
             if (p) {
                orders.push({ id: uid(), from: 'me', action: 'buy', productName: p.name, price: p.price * c.count, ts: Date.now(), status: 'done' });
             }
          });
          DB.setOrders(orders);
          DB.setCart([]);
          setTimeout(() => { renderShop(); toast('购买成功'); }, 300);
      } }
    ],
    bottom: true
  });
  
  m.mask.querySelectorAll('[data-del-cart]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.delCart;
      const c = DB.cart().filter(x => x.pid !== pid);
      DB.setCart(c);
      m.close();
      setTimeout(openCartModal, 300);
    });
  });
}

// 系统随机请求代付/购买/许愿
function autoSimulateShop() {
  if (Math.random() > 0.3) return;
  const orders = DB.orders();
  const last = orders[orders.length - 1];
  if (last && Date.now() - last.ts < 60000) return;
  
  const products = DB.products();
  if (!products.length) return;
  const p = products[Math.floor(Math.random() * products.length)];
  const actionType = Math.random();
  
  if (actionType < 0.33) {
     orders.push({
       id: uid(), from: 'other', action: 'req_pay', productName: p.name, price: p.price, ts: Date.now(), status: 'pending'
     });
     toast('对方请求你代付一件商品');
  } else if (actionType < 0.66) {
     orders.push({
       id: uid(), from: 'other', action: 'buy', productName: p.name, price: p.price, ts: Date.now(), status: 'done'
     });
     if (Math.random() > 0.3) {
        appendMessage({ id: uid(), from: 'other', type: 'gift', giftData: p, ts: Date.now() });
     }
  } else {
     orders.push({
       id: uid(), from: 'other', action: 'wish', productName: p.name, price: p.price, ts: Date.now(), status: 'pending'
     });
     toast('对方许下了一个心愿');
  }
  DB.setOrders(orders);
  if (state.tab === 'shop') renderShop();
}

function openWishlist() {
  const orders = DB.orders().filter(o => o.action === 'wish');
  const myWishes = orders.filter(o => o.from === 'me').sort((a,b) => b.ts - a.ts);
  const friendWishes = orders.filter(o => o.from === 'other').sort((a,b) => b.ts - a.ts);

  function renderList(list, isFriend) {
    if (!list.length) return '<div style="text-align:center;font-size:13px;color:var(--text-tertiary);padding:30px 0;">暂无心愿</div>';
    return list.map(o => {
      let actionBtn = '';
      if (isFriend && o.status === 'pending') {
        actionBtn = `<button class="btn primary" style="width:auto; padding:6px 12px; font-size:12px; border-radius:8px;" data-fulfill-wish="${o.id}">帮Ta实现</button>`;
      } else if (o.status === 'done') {
        actionBtn = `<div class="order-status done" style="margin-top:0;padding:4px 8px;">已实现</div>`;
      } else if (o.status === 'rejected') {
        actionBtn = `<div class="order-status rejected" style="margin-top:0;padding:4px 8px;">已失效</div>`;
      } else {
        actionBtn = `<div class="order-status pending" style="margin-top:0;padding:4px 8px;">等待实现</div>`;
      }

      return `
        <div class="order-card" style="padding:10px; margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:14px;font-weight:600;color:var(--text);">${esc(o.productName)}</div>
              <div style="font-size:12px;color:var(--danger);font-weight:700;margin-top:2px;">¥${o.price.toFixed(2)}</div>
            </div>
            <div>
              ${actionBtn}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  const body = `
    <div style="display:flex; gap:10px; margin-bottom:14px;">
      <button class="btn ghost" id="tabMyWish" style="flex:1; border-radius:12px;">我的心愿</button>
      <button class="btn ghost" id="tabFriendWish" style="flex:1; border-radius:12px;">Ta的心愿</button>
    </div>

      ${renderList(myWishes, false)}
    </div>
  `;

  const m = openModal({
    title: '心愿单',
    bodyHTML: body,
    actions: [{ text: '关闭', primary: true }],
    bottom: true
  });

  const tabMy = m.mask.querySelector('#tabMyWish');
  const tabFriend = m.mask.querySelector('#tabFriendWish');
  const container = m.mask.querySelector('#wishlistContainer');
  
  tabMy.style.background = 'var(--blue)';
  tabMy.style.color = '#fff';

  tabMy.addEventListener('click', () => {
    tabMy.style.background = 'var(--blue)'; tabMy.style.color = '#fff';
    tabFriend.style.background = ''; tabFriend.style.color = '';
    container.innerHTML = renderList(myWishes, false);
    bindActions();
  });

  tabFriend.addEventListener('click', () => {
    tabFriend.style.background = 'var(--blue)'; tabFriend.style.color = '#fff';
    tabMy.style.background = ''; tabMy.style.color = '';
    container.innerHTML = renderList(friendWishes, true);
    bindActions();
  });

  function bindActions() {
    container.querySelectorAll('[data-fulfill-wish]').forEach(btn => {
      btn.addEventListener('click', () => {
        const oid = btn.dataset.fulfillWish;
        const allOrders = DB.orders();
        const o = allOrders.find(x => x.id === oid);

        if (DB.userWallet() < o.price) { toast('余额不足'); return; }
        
        confirmBox('实现心愿', `花费 ¥${o.price} 为Ta实现愿望【${o.productName}】吗？`, () => {

          appendMessage({ id: uid(), from: 'me', type: 'gift', giftData: p, ts: Date.now() });
        });
      });
    });
  }
  bindActions();
}

/* ============================================================
   信箱系统
   ============================================================ */
function updateLetterBadge() {
    const letters = DB.letters();
    const unread = letters.filter(l => l.from === 'other' && !l.isRead).length;
    const badge = $('#letterBadge');
    if (badge) {
        if (unread > 0) badge.classList.add('show');
        else badge.classList.remove('show');
    }
}

function checkAutoLetter() {
    const st = DB.settings();
    if (!st.autoLetter) return;
    
    if (Math.random() > 0.3) return;
    
    const letters = DB.letters();
    const lastLetter = letters[letters.length - 1];
    if (lastLetter && Date.now() - lastLetter.ts < 60000) return;

    const cards = getTextCards();
    if (!cards.length) return;

    let content = [];
    let count = st.letterCardsCount || 1;
    for (let i = 0; i < count; i++) {
        content.push(cards[Math.floor(Math.random() * cards.length)]);
    }
    let text = content.join('\n');

    if (st.letterUseSticker) {
        const stickers = DB.stickers();
        if (stickers.length > 0) {
            const s = stickers[Math.floor(Math.random() * stickers.length)];
            text += '\n\n[表情:' + s.url + ']';
        }
    }

    const titles = ['见字如面', '展信佳', '一封手写信', '深夜杂记', '日常分享'];
    const title = titles[Math.floor(Math.random() * titles.length)];

    letters.push({
        id: uid(),
        from: 'other',
        title: title,
        content: text,
        ts: Date.now(),
        isRead: false
    });
    
    if (letters.length > 50) letters.shift();
    
    DB.setLetters(letters);
    updateLetterBadge();
    if (document.getElementById('letterScreen').classList.contains('show')) renderLetterList();
}

function renderLetterList() {
    const container = $('#letterListContainer');
    if (!container) return;
    
    const letters = DB.letters().slice().sort((a,b) => b.ts - a.ts);
    
    if (!letters.length) {
        container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-tertiary);font-size:13px;">信箱空空如也<br>快去给Ta写信吧</div>';
        return;
    }

    container.innerHTML = letters.map(l => {
        let preview = l.content.replace(/\[表情:.*?\]/g, '[表情]').replace(/\n/g, ' ');
        return '<div class="letter-item ' + (l.from === 'me' ? 'from-me' : '') + ' ' + (!l.isRead ? 'unread' : '') + '" data-lid="' + l.id + '">' +
            '<div class="l-icon">' + icon(l.from === 'me' ? 'pen' : 'mail', 20) + '</div>' +
            '<div class="l-info">' +
                '<div class="l-title">' + esc(l.title) + '</div>' +
                '<div class="l-preview">' + esc(preview) + '</div>' +
                '<div class="l-time">' + esc(fmtRel(l.ts)) + '</div>' +
            '</div>' +
        '</div>';
    }).join('');

    container.querySelectorAll('.letter-item').forEach(el => {
        el.addEventListener('click', () => openLetterDetail(el.dataset.lid));
    });
}

function openLetterbox() {
    $('#letterScreen').classList.add('show');
    renderLetterList();
}

function openLetterDetail(lid) {
    const letters = DB.letters();
    const idx = letters.findIndex(l => l.id === lid);
    if (idx < 0) return;
    const l = letters[idx];
    
    if (!l.isRead) {
        l.isRead = true;
        DB.setLetters(letters);
        updateLetterBadge();
        renderLetterList();
    }

    const isMe = l.from === 'me';
    const f = getCurrentFriend();
    const friendName = f ? f.name : '对方';
    
    let htmlContent = esc(l.content);
    htmlContent = htmlContent.replace(/\[表情:(.*?)\]/g, '<br><img src="$1" style="max-width:100px;max-height:100px;border-radius:8px;margin-top:8px;">');

            '<button class="btn" id="btnReplyLetter">写回信</button></div>';
    }

    openModal({
        title: l.title,
        bodyHTML: 
            '<div style="font-size:12px;color:var(--text-tertiary);text-align:center;margin-bottom:16px;">' +
                (isMe ? '我' : friendName) + ' · ' + fmtTime(l.ts) +
            '</div>' +
            '<div style="font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text);">' + htmlContent + '</div>' +
            replyBtnHTML,

}

function openWriteLetter(replyTitle) {
    const body = 
        '<div class="field"><label>标题</label><input type="text" id="letterTitle" value="' + esc(replyTitle ? 'Re: ' + replyTitle : '') + '" placeholder="无题"></div>' +
        '<div class="field"><label>内容</label><textarea id="letterContent" rows="6" placeholder="写点什么…"></textarea></div>';

    openModal({
        title: '写新信',
        bodyHTML: body,
        actions: [
            { text: '取消' },
            { text: '寄出', primary: true, onClick: (mask) => {
                const title = mask.querySelector('#letterTitle').value.trim() || '无题';
                const content = mask.querySelector('#letterContent').value.trim();
                if (!content) { toast('内容不能为空'); return false; }

                const letters = DB.letters();
                letters.push({
                    id: uid(),
                    from: 'me',
                    title: title,
                    content: content,
                    ts: Date.now(),
                    isRead: true
                });
                DB.setLetters(letters);
                toast('信件已寄出');
                
                if (replyTitle) {
                    setTimeout(() => autoReplyLetter(), 3000 + Math.random()*3000);
                }
                if (document.getElementById('letterScreen').classList.contains('show')) renderLetterList();
            } }
        ],
        bottom: true
    });
}

function autoReplyLetter() {
    const cards = getTextCards();
    if (!cards.length) return;
    const st = DB.settings();
    
    let content = [];
    let count = st.letterCardsCount || 1;
    for (let i = 0; i < count; i++) {
        content.push(cards[Math.floor(Math.random() * cards.length)]);
    }
    let text = content.join('\n');

    if (st.letterUseSticker) {
        const stickers = DB.stickers();
        if (stickers.length > 0) {
            text += '\n\n[表情:' + stickers[Math.floor(Math.random() * stickers.length)].url + ']';
        }
    }

    const titles = ['收到你的信啦', '见字如面', '回信', '展信佳'];
    const title = titles[Math.floor(Math.random() * titles.length)];

    const letters = DB.letters();
    letters.push({
        id: uid(),
        from: 'other',
        title: title,
        content: text,
        ts: Date.now(),
        isRead: false
    });
    DB.setLetters(letters);
    updateLetterBadge();
    toast('收到一封新回信');
    if (document.getElementById('letterScreen').classList.contains('show')) renderLetterList();
}

function checkAutoMoment() {
    const st = DB.settings();
    if (!st.autoMoment) return;
    
    if (Math.random() > 0.3) return;
    
    const moments = DB.moments();
    const lastMoment = moments[moments.length - 1];
    if (lastMoment && Date.now() - lastMoment.ts < 5 * 60000) return;

    const cards = getTextCards();
    if (!cards.length) return;

    const f = getCurrentFriend();
    if (!f) return;

    let count = st.momentCardsCount || 1;
    let textArr = [];
    for (let i=0; i<count; i++) {
        textArr.push(cards[Math.floor(Math.random() * cards.length)]);
    }
    let text = textArr.join('\n');
    
    let images = [];
    const stickers = DB.stickers();
    if (stickers.length > 0 && Math.random() > 0.5) {
        const num = Math.floor(Math.random()*2)+1;
        for(let i=0;i<num;i++) {
            images.push(stickers[Math.floor(Math.random()*stickers.length)].url);
        }
    }

    moments.push({
        id: uid(),
        authorId: f.id,
        text: text,
        images: images,
        ts: Date.now(),
        likes: [],
        comments: []
    });
    DB.setMoments(moments);
    renderMoments();
    toast(f.name + ' 发布了新朋友圈');
}

const Call = {
  state: 'idle', friendId: null, startedAt: 0, timerId: null,
  outgoingTimeout: null, minimized: false, muted: false, bannerEl: null,
  friend(){ return DB.friends().find(f => f.id === this.friendId) || { name: '未知', avatar: '' }; },
  startOutgoing(){
    const f = getCurrentFriend();
    if (!f) return;
    this.reset(false);
    this.friendId = f.id;
    this.state = 'outgoing';
    this.render();
    this.outgoingTimeout = setTimeout(() => { if (this.state === 'outgoing') this.connect(); }, 3200);
  },
  simulateIncoming(){
    const f = getCurrentFriend();
    if (!f) { toast('请先添加并选择一位好友'); return; }
    if (this.state === 'connected' || this.state === 'outgoing') { toast('当前正在通话中'); return; }
    this.reset(false);
    this.friendId = f.id;
    this.state = 'incoming';
    this.renderBanner();
  },
  accept(){ if (this.state !== 'incoming') return; this.removeBanner(); this.connect(); },
  decline(){ this.removeBanner(); this.reset(true); toast('已拒绝来电'); },
  postpone(){ this.removeBanner(); this.renderBanner(); },
  connect(){
    this.removeBanner();
    if (this.outgoingTimeout) { clearTimeout(this.outgoingTimeout); this.outgoingTimeout = null; }
    this.state = 'connected';
    this.startedAt = Date.now();
    this.minimized = false;
    this.render();
    if (this.timerId) clearInterval(this.timerId);
    this.timerId = setInterval(() => {
      const t = fmtDur((Date.now() - this.startedAt) / 1000);
      const a = document.getElementById('callTimer'); if (a) a.textContent = t;
      const b = document.getElementById('miniTimer'); if (b) b.textContent = t;
    }, 500);
  },
  hangup(){ if (this.state === 'idle') return; this.reset(true); toast('通话已结束'); },
  minimize(){ this.minimized = true; this.render(); },
  expand(){ this.minimized = false; this.render(); },
  toggleMute(){ this.muted = !this.muted; this.render(); },
  reset(clearLayer){
    if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
    if (this.outgoingTimeout) { clearTimeout(this.outgoingTimeout); this.outgoingTimeout = null; }
    this.removeBanner();
    this.state = 'idle'; this.friendId = null; this.startedAt = 0;
    this.minimized = false; this.muted = false;
    if (clearLayer !== false) this.render();
  },
  removeBanner(){ if (this.bannerEl) { this.bannerEl.remove(); this.bannerEl = null; } },
  renderBanner(){
    this.removeBanner();
    const f = this.friend();
    const el = document.createElement('div');
    el.className = 'call-banner';
    el.innerHTML =
      avatarHTML(f.avatar, f.name, 40) +
      '<div class="b-info" id="bannerInfo">' +
        '<div class="b-name">' + esc(f.name) + '</div>' +
        '<div class="b-sub">邀请你进行语音通话</div>' +
      '</div>' +
      '<button class="decline" id="bDecline">' + icon('phoneDown', 17) + '</button>' +
      '<button class="accept" id="bAccept">' + icon('phone', 17) + '</button>';
    document.body.appendChild(el);
    this.bannerEl = el;
    el.querySelector('#bAccept').addEventListener('click', () => this.accept());
    el.querySelector('#bDecline').addEventListener('click', () => this.decline());
    el.querySelector('#bannerInfo').addEventListener('click', () => this.postpone());
  },
  render(){
    const layer = $('#callLayer');
    layer.innerHTML = '';
    this.removeBanner();
    if (this.state === 'idle') return;
    const f = this.friend();
    if (this.state === 'incoming'){ this.renderBanner(); return; }
    if (this.state === 'outgoing'){
      layer.innerHTML = '<div class="call-screen show">' +
          avatarHTML(f.avatar, f.name, 96) +
          '<div class="c-name">' + esc(f.name) + '</div>' +
          '<div class="c-status">正在呼叫…</div><div class="c-spacer"></div>' +
          '<div class="call-btns"><div class="call-btn-wrap">' +
            '<button class="call-btn hang" id="cHang">' + icon('phoneDown', 26) + '</button>' +
            '<span>取消</span></div></div></div>';
      layer.querySelector('#cHang').addEventListener('click', () => this.hangup());
      return;
    }
    if (this.minimized){
      const el = document.createElement('div');
      el.className = 'call-mini'; el.id = 'callMini';
      el.innerHTML = avatarHTML(f.avatar, f.name, 38) +
        '<div class="m-info">' +
          '<div class="m-name">' + esc(f.name) + '</div>' +
          '<div class="m-time" id="miniTimer">' + fmtDur((Date.now() - this.startedAt) / 1000) + '</div>' +
        '</div>' +
        '<button id="miniExpand">' + icon('expand', 15) + '</button>' +
        '<button class="hang" id="miniHang">' + icon('phoneDown', 15) + '</button>';
      layer.appendChild(el);
      el.style.left = Math.max(10, window.innerWidth - 190 - 14) + 'px';
      el.style.top = Math.max(10, window.innerHeight - 64 - 90) + 'px';
      el.querySelector('#miniExpand').addEventListener('click', e => { e.stopPropagation(); this.expand(); });
      el.querySelector('#miniHang').addEventListener('click', e => { e.stopPropagation(); this.hangup(); });
      makeDraggable(el);
      return;
    }
    layer.innerHTML = '<div class="call-screen show">' +
        avatarHTML(f.avatar, f.name, 96) +
        '<div class="c-name">' + esc(f.name) + '</div>' +
        '<div class="c-status" id="callTimer">' + fmtDur((Date.now() - this.startedAt) / 1000) + '</div>' +
        '<div class="c-spacer"></div>' +
        '<div class="call-btns">' +
          '<div class="call-btn-wrap">' +
            '<button class="call-btn ' + (this.muted ? 'on' : '') + '" id="cMute">' +
              icon(this.muted ? 'micOff' : 'mic', 26) +
            '</button><span>' + (this.muted ? '已静音' : '静音') + '</span></div>' +
          '<div class="call-btn-wrap">' +
            '<button class="call-btn hang" id="cHang">' + icon('phoneDown', 26) + '</button>' +
            '<span>挂断</span></div>' +
          '<div class="call-btn-wrap">' +
            '<button class="call-btn" id="cMin">' + icon('minimize', 26) + '</button>' +
            '<span>缩小</span></div>' +
        '</div></div>';
    layer.querySelector('#cMute').addEventListener('click', () => this.toggleMute());
    layer.querySelector('#cHang').addEventListener('click', () => this.hangup());
    layer.querySelector('#cMin').addEventListener('click', () => this.minimize());
  }
};

function makeDraggable(el){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    dragging = true; el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const margin = 8;
    let left = ox + (e.clientX - sx);
    let top = oy + (e.clientY - sy);
    left = clamp(left, margin, Math.max(margin, window.innerWidth - r.width - margin));
    top = clamp(top, margin, Math.max(margin, window.innerHeight - r.height - margin));
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch(err){}
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ============================================================
   音乐播放器
   ============================================================ */
const Player = {
  audio: null, index: -1, playing: false, objectUrl: null, triedOuter: false,

  init(){
    if (this.audio) return;
    const a = new Audio();
    a.preload = 'auto';
    this.audio = a;
    a.addEventListener('timeupdate', () => updateSeekUI());
    a.addEventListener('ended', () => { this.next(true); });
    a.addEventListener('loadedmetadata', () => updateSeekUI());
    a.addEventListener('error', () => { this.onAudioError(); });
  },

  async onAudioError(){
    this.playing = false;
    const song = DB.playlist()[this.index];
    if (!song) return;

    if (song.source === 'netease' && !this.triedOuter) {
      this.triedOuter = true;
      this.audio.src = `https://music.163.com/song/media/outer/url?id=${song.nid}.mp3`;
      try {
        await this.audio.play();
        this.playing = true;
        renderMusic();
        return;
      } catch(e) {}
    }

    renderMusic();
    if (song.source === 'netease'){
      toast('播放失败（可能为VIP或无版权），请尝试上传本地音频', 3200);
    } else {
      toast('播放失败');
    }
  },

  async load(index, autoplay){
    const list = DB.playlist();
    if (index < 0 || index >= list.length) return;
    this.init();
    this.index = index;
    this.triedOuter = false;
    const song = list[index];

    if (this.objectUrl){ URL.revokeObjectURL(this.objectUrl); this.objectUrl = null; }
    this.audio.pause();
    this.audio.removeAttribute('src');
    this.playing = false;

    let srcUrl = '';

    if (song.source === 'local' && song.audioKey){
      try{
        const blob = await getAudio(song.audioKey);
        if (blob){ this.objectUrl = URL.createObjectURL(blob); srcUrl = this.objectUrl; }
      }catch(e){}
      if (!srcUrl){ this.playing = false; renderMusic(); toast('本地音频读取失败'); return; }
    } else if (song.source === 'netease' && song.nid){
      srcUrl = `https://music.163.com/song/media/outer/url?id=${song.nid}.mp3`;
    }

    if (!srcUrl){ this.playing = false; renderMusic(); toast('无法获取播放地址'); return; }

    this.audio.src = srcUrl;
    this.audio.volume = 1;
    this.audio.load();

    if (autoplay){
      try{
        await this.audio.play();
        this.playing = true;
      }catch(e){
        this.playing = false;
        console.log('Play blocked', e);
      }
    }
    renderMusic();
  },

  async play(){
    this.init();
    const list = DB.playlist();
    if (!list.length){ toast('歌单为空，请先添加歌曲'); return; }
    if (this.index < 0 || !this.audio.src){
      await this.load(this.index < 0 ? 0 : this.index, true);
      return;
    }
    try{
      await this.audio.play();
      this.playing = true;
      renderMusic();
    }catch(e){ await this.load(this.index, true); }
  },

  async pause(){
    if (this.audio) this.audio.pause();
    this.playing = false;
    renderMusic();
  },

  async next(auto){
    const list = DB.playlist();
    if (!list.length) return;
    const nextIdx = (this.index + 1) % list.length;
    await this.load(nextIdx, true);
    if (!auto) toast('已切到下一首');
  },

  async prev(){
    const list = DB.playlist();
    if (!list.length) return;
    const prevIdx = (this.index - 1 + list.length) % list.length;
    await this.load(prevIdx, true);
  },

  async seekTo(ratio){
    if (!this.audio || !this.audio.duration) return;
    this.audio.currentTime = clamp(ratio, 0, 1) * this.audio.duration;
    updateSeekUI();
  }
};

function updateSeekUI(){
  const seek = $('#seekBar');
  const cur = $('#seekCur');
  const tot = $('#seekTot');
  if (!seek || !Player.audio) return;
  const d = Player.audio.duration || 0;
  const c = Player.audio.currentTime || 0;
  const p = d ? (c / d) * 100 : 0;
  seek.value = p;
  seek.style.background = 'linear-gradient(to right, var(--text) ' + p + '%, var(--fill-2) ' + p + '%)';
  if (cur) cur.textContent = fmtDur(c);
  if (tot) tot.textContent = d ? fmtDur(d) : '--:--';
}

function renderMusic(){

  const list = DB.playlist();
  const together = DB.together();
  const song = (Player.index >= 0 && list[Player.index]) ? list[Player.index] : (list[0] || null);

  let statusText = '独自收听中';
  if (together && together.status === 'waiting') statusText = '等待对方接受邀请';
  else if (together && together.status === 'active') statusText = '正在和好友一起听';

  const coverInner = song && song.cover
    ? '<img src="' + esc(song.cover) + '" alt="">'
    : icon('music', 30);

  const songRows = list.length
    ? list.map((s, i) =>
        '<div class="song-item ' + (i === Player.index ? 'playing' : '') + '" data-idx="' + i + '">' +

        '</div>'
      ).join('')
    : '<div style="padding:22px 4px;text-align:center;font-size:13px;color:var(--text-tertiary);line-height:1.7;">歌单为空<br>导入网易云歌单或上传本地音频</div>';

  const togetherBar = together && together.status === 'active'
    ? '<div class="card" style="display:flex;align-items:center;gap:12px;">' +
        icon('wave', 20) +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:14px;font-weight:600;">一起听进行中</div>' +
          '<div style="font-size:12px;color:var(--text-secondary);margin-top:3px;" id="togetherTime">' +
            '已一起听 ' + fmtDur((Date.now() - together.startedAt) / 1000) +
          '</div>' +
        '</div>' +
        '<button class="btn ghost" id="btnEndTogether" style="width:auto;padding:9px 14px;font-size:13px;">结束</button>' +
      '</div>' : '';

  scroll.innerHTML =
    togetherBar +
    '<div class="card player-card">' +
      '<div class="player-top">' +
        '<div class="cover">' + coverInner + '</div>' +
        '<div class="player-meta">' +
          '<div class="p-name">' + esc(song ? song.name : '暂无歌曲') + '</div>' +
          '<div class="p-artist">' + esc(song ? (song.artist || '未知歌手') : '请先添加歌曲') + '</div>' +
          '<div class="p-status">' + esc(statusText) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="seek-wrap">' +
        '<input type="range" class="seek" id="seekBar" min="0" max="100" step="0.1" value="0">' +
        '<div class="seek-time"><span id="seekCur">00:00</span><span id="seekTot">--:--</span></div>' +
      '</div>' +
      '<div class="controls">' +
        '<button class="ctrl-btn" id="btnPrev">' + icon('prev', 24) + '</button>' +
        '<button class="ctrl-btn main" id="btnPlay">' + icon(Player.playing ? 'pause' : 'play', 26) + '</button>' +
        '<button class="ctrl-btn" id="btnNext">' + icon('next', 24) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div style="font-size:14px;font-weight:600;margin-bottom:12px;">歌单</div>' +
      '<div class="song-list">' + songRows + '</div>' +
      '<div style="display:flex;justify-content:center;gap:12px;margin-top:16px;">' +
        '<button class="btn ghost" id="btnImportNetease" style="width:auto;padding:8px 16px;font-size:13px;border-radius:10px;display:flex;align-items:center;gap:6px;">' + icon('link', 16) + ' 导入歌单</button>' +
        '<button class="btn ghost" id="btnUploadAudio" style="width:auto;padding:8px 16px;font-size:13px;border-radius:10px;display:flex;align-items:center;gap:6px;">' + icon('upload', 16) + ' 上传音频</button>' +
      '</div>' +
    '</div>';

  const playBtn = $('#btnPlay');
  if (playBtn) playBtn.addEventListener('click', () => {
    if (Player.playing) Player.pause(); else Player.play();
  });
  const prevBtn = $('#btnPrev'); if (prevBtn) prevBtn.addEventListener('click', () => Player.prev());
  const nextBtn = $('#btnNext'); if (nextBtn) nextBtn.addEventListener('click', () => Player.next(false));

  const seekBar = $('#seekBar');
  if (seekBar){
    seekBar.addEventListener('input', () => {
      const p = parseFloat(seekBar.value) || 0;
      seekBar.style.background = 'linear-gradient(to right, var(--text) ' + p + '%, var(--fill-2) ' + p + '%)';
    });
    seekBar.addEventListener('change', () => {
      Player.seekTo((parseFloat(seekBar.value) || 0) / 100);
    });
  }

  $$('#musicScroll [data-idx]').forEach(el => {
    el.addEventListener('click', async e => {
      if (e.target.closest('[data-del]')) return;
      const i = parseInt(el.dataset.idx, 10);
      if (i === Player.index && Player.playing) return;
      await Player.load(i, true);
    });
  });

  $$('#musicScroll [data-del]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.del, 10);
      const list = DB.playlist();
      const removed = list.splice(i, 1)[0];
      DB.setPlaylist(list);
      if (removed.source === 'local' && removed.audioKey) { try{ await delAudio(removed.audioKey); }catch(err){} }
      if (Player.index === i){ Player.index = -1; Player.audio && Player.audio.pause(); Player.playing = false; }
      else if (Player.index > i) Player.index--;
      renderMusic();
    });

  const btnEnd = $('#btnEndTogether');

    const t = DB.together();
    if (t && t.messageId){
      const msgs = DB.chat(t.friendId);
      const msg = msgs.find(m => m.id === t.messageId);
      if (msg){ msg.inviteStatus = 'ended'; DB.setChat(t.friendId, msgs); }

    DB.setTogether(null);
    renderMusic();
    toast('已结束一起听');

function extractPlaylistId(input){
  const s = String(input || '').trim();
  if (/^\d+$/.test(s)) return s;
  const m = s.match(/[?&#]id=(\d+)/);
  return m ? m[1] : null;
}

function fetchWithTimeout(url, ms){
  return new Promise((resolve, reject) => {
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = setTimeout(() => {
      if (ctrl) { try { ctrl.abort(); } catch(e){} }
      reject(new Error('timeout'));
    }, ms || 8000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(r => { clearTimeout(timer); resolve(r); })
      .catch(e => { clearTimeout(timer); reject(e); });
  });
}

async function fetchNeteasePlaylist(link){
  const id = extractPlaylistId(link);
  if (!id) throw new Error('无法识别歌单 ID');

  const nodes = [
    'https://api.injahow.cn/meting/?type=playlist&id=',
    'https://api.qijieya.cn/meting/?type=playlist&id=',
    'https://api.i-meto.com/meting/api?server=netease&type=playlist&id='
  ];

  let lastErr = null;
  for (const base of nodes) {
    try {
      const res = await fetchWithTimeout(base + id, 12000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      let arr = Array.isArray(data) ? data : (data.data && Array.isArray(data.data) ? data.data : null);
      if (!arr || arr.length === 0) throw new Error('歌单为空或解析失败');
      return arr.map(s => {
        let cover = s.pic || s.cover || (s.al && s.al.picUrl) || (s.album && s.album.picUrl) || '';
        if (cover.startsWith('http://')) cover = cover.replace('http://', 'https://');
        let artistName = getArtistName(s);
        let songId = s.id || s.song_id || s.url_id || s.nid;
        if (!songId && s.url) {
           const m = s.url.match(/id=(\d+)/);
           if (m) songId = m[1];
        }
        return {
          id: 'ne_' + (songId || uid()),
          nid: String(songId || ''),
          name: s.name || s.title || '未知歌曲',
          artist: artistName,
          cover: cover,
          source: 'netease'
        };
      });
    } catch (err) {
      lastErr = err;
      console.warn('Meting node failed:', base, err);
    }
  }
  throw new Error(lastErr ? lastErr.message : '所有解析节点均失败');
}

function openNeteaseImport(){
  const body =
    '<div class="field"><label>网易云歌单链接 / ID</label>' +
      '<input type="text" id="npLink" placeholder="https://music.163.com/#/playlist?id=...">' +
      '<div class="hint">支持完整链接或纯数字 ID。播放时自动解析音源。</div>' +
    '</div>';
  openModal({
    title: '导入网易云歌单',
    bodyHTML: body,
    actions: [
      { text: '取消' },
      { text: '导入', primary: true, onClick: async (mask, close) => {
          const link = mask.querySelector('#npLink').value.trim();
          if (!link){ toast('请填写歌单链接或 ID'); return false; }
          if (!extractPlaylistId(link)){ toast('链接格式无法识别'); return false; }
          const btn = mask.querySelector('.modal-actions button.primary');
          if (btn){ btn.textContent = '解析中…'; btn.disabled = true; }
          try{
            const songs = await fetchNeteasePlaylist(link);
            const list = DB.playlist();
            const exist = new Set(list.map(s => s.id));
            let added = 0, skipped = 0;
            songs.forEach(s => {
              if (exist.has(s.id)) { skipped++; return; }
              exist.add(s.id); list.push(s); added++;
            });
            DB.setPlaylist(list);
            close(); renderMusic();
            toast('导入成功：新增 ' + added + ' 首' + (skipped ? '，跳过 ' + skipped + ' 首' : ''));
          }catch(err){
            if (btn){ btn.textContent = '导入'; btn.disabled = false; }
            toast('解析失败：' + (err.message || '接口异常'));
          }
          return false;
        } }
    ],
    bottom: true
  });
}

function openLocalUpload(){
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'audio/*'; fileInput.style.display = 'none';
  document.body.appendChild(fileInput);
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    document.body.removeChild(fileInput);
    if (!file) return;
    if (file.size > 30 * 1024 * 1024){ toast('音频请控制在 30MB 以内'); return; }
    const defaultName = file.name.replace(/\.[^.]+$/, '');
    const body =
      '<div class="field"><label>歌名</label><input type="text" id="upName" value="' + esc(defaultName) + '"></div>' +
      '<div class="field"><label>歌手</label><input type="text" id="upArtist" placeholder="未知歌手"></div>' +
      '<div class="field"><label>封面（可选）</label><input type="file" id="upCover" accept="image/*" style="font-size:13px;color:var(--text-secondary);width:100%;"></div>';
    openModal({
      title: '上传本地音频', bodyHTML: body,
      actions: [
        { text: '取消' },
        { text: '保存', primary: true, onClick: async (mask, close) => {
            const name = mask.querySelector('#upName').value.trim() || defaultName;
            const artist = mask.querySelector('#upArtist').value.trim() || '未知歌手';
            const coverInput = mask.querySelector('#upCover');
            let cover = '';
            if (coverInput.files && coverInput.files[0]){
              try{ cover = await compressImage(coverInput.files[0], 400, 0.75); }catch(e){}
            }
            const key = 'local_' + uid();
            try{ await putAudio(key, file); }
            catch(e){ toast('音频保存失败，存储空间可能不足'); return false; }
            const list = DB.playlist();
            list.push({ id: key, name, artist, cover, source: 'local', audioKey: key });
            DB.setPlaylist(list);
            close(); renderMusic();
            toast('已添加到歌单');
            return false;
          } }
      ], bottom: true
    });
  });
  fileInput.click();
}

function compressImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try{
        const scale = Math.min(1, (maxW || 720) / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality || 0.75));
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

function inviteToListen(){
  const friends = DB.friends();
  if (!friends.length){

      const msgs = DB.chat(fid);
      msgs.push({ id: msgId, from: 'me', type: 'invite', ts: Date.now(), inviteStatus: 'pending' });

        const t = DB.together();

        const accepted = Math.random() > 0.3;
        const msgsNow = DB.chat(fid);
        const msgNow = msgsNow.find(x => x.id === msgId);
        if (msgNow) {
          msgNow.inviteStatus = accepted ? 'accepted' : 'rejected';
          DB.setChat(fid, msgsNow);

          DB.setTogether({ friendId: fid, status: 'active', startedAt: Date.now(), messageId: msgId });
          renderMusic(); renderChat(); switchTab('music');

function renderMoments(){
  const scroll = $('#momentsScroll');
  const moments = DB.moments().slice().sort((a, b) => b.ts - a.ts);
  if (!moments.length){
    scroll.innerHTML = '<div class="empty" style="min-height:60vh;">' +
        '<div class="e-icon">' + icon('camera', 28) + '</div>' +
        '<div class="e-title">还没有动态</div>' +
        '<div class="e-desc">点击右上角发布第一条朋友圈。</div>' +
      '</div>';
    return;
  }
  scroll.innerHTML = moments.map(m => {
    const au = authorOf(m.authorId);
    const liked = (m.likes || []).includes('me');
    const imgCount = (m.images || []).length;
    const gridCls = imgCount === 1 ? 'n1' : imgCount === 2 ? 'n2' : 'n3';
    const imgs = imgCount ? '<div class="moment-imgs ' + gridCls + '">' +
        m.images.map(src => '<img src="' + esc(src) + '" alt="">').join('') + '</div>' : '';
    const comments = (m.comments || []).length ? '<div class="moment-comments">' +
        m.comments.map(c => {
          const ca = authorOf(c.authorId);
          return '<div class="cmt"><b>' + esc(ca.name) + '</b>：' + esc(c.text) + '</div>';
        }).join('') + '</div>' : '';
    return '<div class="card moment-card" data-mid="' + m.id + '">' +
      '<div class="moment-head">' + avatarHTML(au.avatar, au.name, 40) +
        '<div class="m-info"><div class="m-name">' + esc(au.name) + '</div>' +
          '<div class="m-time">' + esc(fmtRel(m.ts)) + '</div></div>' +
      '</div>' +
      (m.text ? '<div class="moment-text">' + esc(m.text) + '</div>' : '') + imgs +
      '<div class="moment-actions">' +
        '<button data-like="' + m.id + '" class="' + (liked ? 'liked' : '') + '">' +
          icon(liked ? 'heartFill' : 'heart', 17) + '<span>' + (m.likes || []).length + '</span></button>' +
        '<button data-cmt="' + m.id + '">' + icon('bubble', 17) + '<span>' + (m.comments || []).length + '</span></button>' +
      '</div>' + comments + '</div>';
  }).join('');

  scroll.querySelectorAll('[data-like]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mid = btn.dataset.like;
      const moments = DB.moments();
      const m = moments.find(x => x.id === mid);
      if (!m) return;
      m.likes = m.likes || [];
      const i = m.likes.indexOf('me');
      if (i >= 0) m.likes.splice(i, 1); else m.likes.push('me');
      DB.setMoments(moments);
      renderMoments();
    });
    attachLongPress(btn, () => {
      const mid = btn.dataset.like;
      const m = DB.moments().find(x => x.id === mid);
      if (!m) return;
      const likes = m.likes || [];
      if (!likes.length){ toast('还没有人点赞'); return; }
      const html = '<div class="like-list">' + likes.map(id => {
        const a = authorOf(id);
        return '<div class="list-item">' + avatarHTML(a.avatar, a.name, 32) +
          '<div class="li-main"><div class="li-name">' + esc(a.name) + '</div></div></div>';
      }).join('') + '</div>';
      openModal({ title: '点赞', bodyHTML: html, actions: [{ text: '关闭', primary: true }] });
    });
  });

  scroll.querySelectorAll('[data-cmt]').forEach(btn => {
    btn.addEventListener('click', () => openCommentDialog(btn.dataset.cmt));
  });
}

        '<span class="r-chev">' + icon('chevronRight', 18) + '</span></button>' +
    '</div>' +
    '<div class="group-title">关于</div>' +
    '<div class="group"><button class="row" id="rowAbout"><span class="r-label">关于传讯</span>' +
      '<span class="r-chev">' + icon('chevronRight', 18) + '</span></button></div>' +
    '<div style="text-align:center;font-size:11px;color:var(--text-tertiary);padding:8px 0 24px;">传讯 3.5 · 数据仅保存在本机浏览器</div>';

  $('#rowProfile').addEventListener('click', openProfileEditor);
  $('#rowFriends').addEventListener('click', openFriendManager);
  $('#rowTheme').addEventListener('click', toggleTheme);
  $('#rowCards').addEventListener('click', openCardLibrary);
  $('#rowExport').addEventListener('click', exportData);
  $('#rowImport').addEventListener('click', importData);
  $('#rowClearAll').addEventListener('click', clearAllData);
  $('#rowAbout').addEventListener('click', openAbout);
  $('#rowLetterbox').addEventListener('click', openLetterbox);

  // 后台与通知事件
  $('#rowNotifyPerm').addEventListener('click', async () => {
    if (!('Notification' in window)) { toast('当前浏览器不支持通知'); return; }
    const p = await Notification.requestPermission();
    $('#notifyPermStatus').textContent = p === 'granted' ? '已授权' : (p === 'denied' ? '已拒绝' : '未授权');
    toast('权限状态: ' + p);
  });

  $('#rowKeepAlive').addEventListener('click', async (e) => {
    e.stopPropagation();
    const sw = $('#swKeepAlive');
    if (KeepAlive.isAudioOn()) {
      KeepAlive.stopAudio();
      sw.classList.remove('on');
      toast('静音保活已关闭');
    } else {
      const ok = await KeepAlive.startAudio();
      if (ok) { sw.classList.add('on'); toast('静音保活已开启'); }
      else { toast('开启失败，请重试'); }
    }
  });

  if (window.__deferredInstallPrompt) {
    $('#rowInstallApp').style.display = 'flex';
    $('#rowInstallApp').addEventListener('click', () => {
      if (window.__deferredInstallPrompt) {
        window.__deferredInstallPrompt.prompt();
        window.__deferredInstallPrompt = null;
        $('#rowInstallApp').style.display = 'none';
      }
    });
  } else {
    $('#rowInstallApp').style.display = 'none';
  }

  const saveSettings = () => {
    const cur = DB.settings();
    cur.waitMin = Math.max(0, parseFloat($('#setWaitMin').value) || 0);
    cur.waitMax = Math.max(0, parseFloat($('#setWaitMax').value) || 0);
    cur.letterCardsCount = Math.max(1, parseInt($('#setLetterCount').value) || 2);
    cur.momentCardsCount = Math.max(1, parseInt($('#setMomentCount').value) || 2);
    DB.setSettings(cur);
    $('#setWaitMin').value = cur.waitMin;
    $('#setWaitMax').value = cur.waitMax;
    $('#setLetterCount').value = cur.letterCardsCount;
    $('#setMomentCount').value = cur.momentCardsCount;
  };
  $('#setWaitMin').addEventListener('change', saveSettings);
  $('#setWaitMax').addEventListener('change', saveSettings);
  $('#setLetterCount').addEventListener('change', saveSettings);
  $('#setMomentCount').addEventListener('change', saveSettings);

  $('#rowAnim').addEventListener('click', () => {
    const cur = DB.settings();
    cur.anim = !cur.anim;
    DB.setSettings(cur);
    $('#rowAnim').querySelector('.switch').classList.toggle('on', cur.anim);
    document.body.classList.toggle('no-anim', !cur.anim);
  });
  $('#rowAutoLetter').addEventListener('click', () => {
    const cur = DB.settings();
    cur.autoLetter = !cur.autoLetter;
    DB.setSettings(cur);
    $('#rowAutoLetter').querySelector('.switch').classList.toggle('on', cur.autoLetter);
  });
  $('#swLetterStk').addEventListener('click', (e) => {
    e.stopPropagation();
    const cur = DB.settings();
    cur.letterUseSticker = !cur.letterUseSticker;
    DB.setSettings(cur);
    e.currentTarget.classList.toggle('on', cur.letterUseSticker);
  });
  $('#rowAutoMoment').addEventListener('click', () => {
    const cur = DB.settings();
    cur.autoMoment = !cur.autoMoment;
    DB.setSettings(cur);
    $('#rowAutoMoment').querySelector('.switch').classList.toggle('on', cur.autoMoment);
  });
}

function openProfileEditor(){
  const me = DB.profile();
  const body =
    '<div style="display:flex;justify-content:center;margin-bottom:16px;">' +
      '<label style="cursor:pointer;position:relative;">' +
        '<span id="avatarPreview">' + avatarHTML(me.avatar, me.name, 76) + '</span>' +
        '<input type="file" id="avatarInput" accept="image/*" style="display:none;"></label></div>' +
    '<div class="field"><label>昵称</label>' +
      '<input type="text" id="profileName" value="' + esc(me.name || '') + '" placeholder="输入昵称"></div>' +
    '<div class="hint" style="font-size:11.5px;color:var(--text-tertiary);">点击头像可更换图片。</div>';
  let newAvatar = me.avatar || '';
  const m = openModal({
    title: '个人信息', bodyHTML: body,
    actions: [
      { text: '取消' },
      { text: '保存', primary: true, onClick: (mask) => {
          const name = mask.querySelector('#profileName').value.trim() || '我';
          DB.setProfile({ name, avatar: newAvatar });
          renderMe(); renderChat(); toast('已保存');
        } }

  });
