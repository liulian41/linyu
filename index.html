<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>传讯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
:root{
  --bg:#f2f2f7;--bg-elevated:rgba(255,255,255,.72);--nav-bg:rgba(249,249,249,.84);
  --card-bg:rgba(255,255,255,.68);--card-bg-solid:#fff;
  --text:#1c1c1e;--text-secondary:#6e6e73;--text-tertiary:#aeaeb2;
  --sep:rgba(60,60,67,.12);--blue:#007aff;
  --bubble-me:#007aff;--bubble-me-text:#fff;
  --bubble-other:rgba(118,118,128,.16);--bubble-other-text:#1c1c1e;
  --danger:#ff3b30;--fill-1:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.20);
  --radius-l:22px;--radius-m:16px;--radius-s:12px;
  --ease:cubic-bezier(.22,1,.36,1);--shadow:0 8px 32px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#000;--bg-elevated:rgba(28,28,30,.74);--nav-bg:rgba(22,22,24,.84);
  --card-bg:rgba(28,28,30,.72);--card-bg-solid:#1c1c1e;
  --text:#f2f2f7;--text-secondary:#98989d;--text-tertiary:#636366;
  --sep:rgba(255,255,255,.12);--blue:#0a84ff;--bubble-me:#0a84ff;
  --bubble-other:rgba(118,118,128,.30);--bubble-other-text:#f2f2f7;
  --fill-1:rgba(120,120,128,.20);--fill-2:rgba(120,120,128,.32);
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 620px at 15% -12%,rgba(120,170,255,.16),transparent 62%),
            radial-gradient(700px 520px at 100% 104%,rgba(255,150,200,.10),transparent 62%);
}
[data-theme="dark"] body::before{
  background:radial-gradient(900px 620px at 15% -12%,rgba(56,110,220,.22),transparent 62%),
            radial-gradient(700px 520px at 100% 104%,rgba(140,80,190,.16),transparent 62%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}
.ico{display:block;flex-shrink:0;}

#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:var(--bg);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  transition:opacity .5s var(--ease);}
#splash.hide{opacity:0;pointer-events:none;}
#splash .splash-text{font-size:30px;font-weight:600;letter-spacing:.14em;color:var(--text);animation:breathe 2.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.42;}50%{opacity:1;}}

#app{flex:1;position:relative;overflow:hidden;z-index:1;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);}
.page.active{opacity:1;pointer-events:auto;}

.nav{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 10px;flex-shrink:0;
  position:relative;z-index:20;background:var(--nav-bg);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-bottom:.5px solid var(--sep);}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:56%;
  padding:4px 10px;border-radius:14px;color:var(--text);
  transition:background .2s var(--ease),transform .18s var(--ease);}
.nav-title:active{transform:translateX(-50%) scale(.95);background:var(--fill-1);}
.nav-title .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-actions{display:flex;align-items:center;gap:2px;margin-left:auto;}
.nav-side{display:flex;align-items:center;gap:2px;}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--blue);
  transition:transform .18s var(--ease),background .2s var(--ease),opacity .2s;}
.icon-btn:active{transform:scale(.86);background:var(--fill-1);}
.icon-btn.danger{color:var(--danger);}
.icon-btn:disabled{opacity:.32;pointer-events:none;}

.tabbar{display:flex;flex-shrink:0;z-index:60;height:calc(54px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--nav-bg);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:.5px solid var(--sep);}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;font-weight:500;letter-spacing:.02em;color:var(--text-tertiary);
  transition:color .25s var(--ease),transform .18s var(--ease);position:relative;}
.tab-item:active{transform:scale(.9);}
.tab-item.active{color:var(--blue);}
.tab-badge{position:absolute;top:4px;right:25%;width:8px;height:8px;border-radius:50%;background:var(--danger);
  display:none;box-shadow:0 0 0 2px var(--nav-bg);}
.tab-badge.show{display:block;}

#chatList{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 10px;display:flex;flex-direction:column;scrollbar-width:none;}
#chatList::-webkit-scrollbar{display:none;}

.time-sep{text-align:center;font-size:11px;color:var(--text-tertiary);margin:14px 0 8px;font-weight:500;}
.revoke-note{text-align:center;font-size:12px;color:var(--text-tertiary);margin:8px 0;font-weight:500;}
.msg-row{display:flex;margin:2px 0;}
.msg-row.me{justify-content:flex-end;}
.msg-row.other{justify-content:flex-start;}

.bubble{max-width:76%;padding:9px 14px;border-radius:20px;
  font-size:16px;line-height:1.38;word-break:break-word;white-space:pre-wrap;
  animation:bubbleIn .34s var(--ease);}
.bubble.me{background:var(--bubble-me);color:var(--bubble-me-text);border-bottom-right-radius:5px;}
.bubble.other{background:var(--bubble-other);color:var(--bubble-other-text);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom-left-radius:5px;}

.bubble-quote{white-space:normal;margin-bottom:6px;padding:6px 10px;border-radius:9px;
  font-size:12px;line-height:1.4;border-left:2.5px solid rgba(0,0,0,.15);
  background:rgba(0,0,0,.05);max-width:100%;overflow:hidden;}
.bubble.me .bubble-quote{background:rgba(255,255,255,.2);border-left-color:rgba(255,255,255,.55);}
.bubble.other .bubble-quote{background:rgba(0,0,0,.07);border-left-color:var(--blue);}
.bq-from{font-size:11px;font-weight:600;opacity:.8;margin-bottom:2px;display:block;}
.bq-text{opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}

body.no-anim .bubble{animation:none;}
@keyframes bubbleIn{from{opacity:0;transform:translateY(12px) scale(.94);}to{opacity:1;transform:none;}}

.sticker-msg{max-width:140px;max-height:140px;object-fit:contain;border-radius:8px;
  animation:bubbleIn .34s var(--ease);cursor:pointer;}
body.no-anim .sticker-msg{animation:none;}

/* 音乐分享卡片 */
.music-card {
  width: 240px;
  background: var(--card-bg-solid);
  border-radius: 14px;
  border: .5px solid var(--sep);
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: pointer;
  transition: transform .15s;
  animation: bubbleIn .34s var(--ease);
}
.music-card:active { transform: scale(0.96); }
.music-cover { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: var(--fill-1); }
.music-info { flex: 1; min-width: 0; text-align: left; }
.music-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-artist { font-size: 12px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-play-btn {
  width: 28px; height: 28px; border-radius: 50%; background: var(--fill-1);
  display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0;
}

/* 礼物卡片 */
.gift-card {
  width: 240px;
  background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
  border-radius: 16px;
  border: 1px solid #ffb6c1;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: bubbleIn .34s var(--ease);
  cursor: pointer;
}
[data-theme="dark"] .gift-card {
  background: linear-gradient(135deg, #3a1c23 0%, #2b141a 100%);
  border-color: #5c2d38;
}
.gift-top { display: flex; align-items: center; gap: 10px; }
.gift-icon { font-size: 36px; }
.gift-info { flex: 1; text-align: left; }
.gift-name { font-size: 15px; font-weight: 700; color: #d11141; }
[data-theme="dark"] .gift-name { color: #ff6b81; }
.gift-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.gift-bottom { font-size: 11px; color: var(--text-tertiary); border-top: 1px dashed rgba(209, 17, 65, .2); padding-top: 8px; text-align: left; }

.rp-wrap{display:flex;width:100%;margin:8px 0;animation:bubbleIn .34s var(--ease);}
.rp-wrap.me{justify-content:flex-end;}
.rp-wrap.other{justify-content:flex-start;}
.rp-card{width:240px;background:var(--card-bg-solid);border-radius:18px;border:.5px solid var(--sep);
  box-shadow:0 4px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);overflow:hidden;
  transition:all .35s var(--ease);}
.rp-quote{white-space:normal;margin:10px 12px 0;padding:6px 10px;border-radius:9px;
  font-size:12px;line-height:1.4;border-left:2.5px solid rgba(0,0,0,.15);
  background:rgba(0,0,0,.05);overflow:hidden;}
[data-theme="dark"] .rp-quote{background:rgba(255,255,255,.06);border-left-color:rgba(255,255,255,.2);}
.rp-quote .bq-from{font-size:11px;font-weight:600;opacity:.7;margin-bottom:2px;display:block;}
.rp-quote .bq-text{opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}

.rp-header{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;
  transition:background .2s;
  background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 100%);}
[data-theme="dark"] .rp-header{background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 100%);}
.rp-header:active{background:var(--fill-1);}
.rp-icon{width:42px;height:42px;border-radius:12px;background:rgba(255,90,95,.08);color:#ff5a5f;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:.5px solid rgba(255,90,95,.15);transition:all .3s;}
[data-theme="dark"] .rp-icon{background:rgba(255,90,95,.15);border-color:rgba(255,90,95,.3);}
.rp-card.received .rp-icon{background:var(--fill-1);color:var(--text-tertiary);border-color:var(--sep);}
.rp-info{flex:1;min-width:0;}
.rp-blessing{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:3px;letter-spacing:.02em;}
.rp-sub{font-size:11.5px;color:var(--text-secondary);}
.rp-cross{width:30px;height:30px;border-radius:50%;background:var(--fill-1);color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;transition:transform .4s var(--ease),background .3s;}
.rp-card.expanded .rp-cross{transform:rotate(45deg);background:var(--fill-2);}
.rp-detail{max-height:0;overflow:hidden;transition:max-height .4s var(--ease);
  background:var(--bg-elevated);backdrop-filter:blur(10px);}
.rp-card.expanded .rp-detail{max-height:160px;}
.rp-detail-inner{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;
  border-top:.5px solid var(--sep);}
.rp-amount{font-size:28px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.rp-btn{width:100%;padding:11px;border-radius:12px;background:var(--blue);color:#fff;
  font-size:15px;font-weight:600;transition:opacity .2s,transform .2s;}
.rp-btn:active{opacity:.8;transform:scale(.97);}

.invite-card{margin:6px 0;padding:12px 14px;border-radius:var(--radius-m);
  background:var(--card-bg);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--sep);max-width:82%;display:flex;flex-direction:column;animation:bubbleIn .34s var(--ease);}
.invite-card.me{margin-left:auto;}
.invite-card .ic-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.invite-card .ic-desc{font-size:12px;color:var(--text-secondary);margin-top:5px;line-height:1.45;display:flex;align-items:center;justify-content:space-between;}
.invite-accept-btn{background:var(--blue);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;}

#typingRow{display:flex;justify-content:flex-start;padding:4px 0;margin-top:2px;}
#typingRow .typing-bubble{background:var(--bubble-other);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:5px;align-items:center;
  animation:bubbleIn .3s var(--ease);}
#typingRow .typing-bubble i{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary);
  animation:dot 1.25s ease-in-out infinite;}
#typingRow .typing-bubble i:nth-child(2){animation-delay:.16s;}
#typingRow .typing-bubble i:nth-child(3){animation-delay:.32s;}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.32;}30%{transform:translateY(-4px);opacity:1;}}

.composer-wrap{flex-shrink:0;background:var(--nav-bg);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:.5px solid var(--sep);z-index:15;display:flex;flex-direction:column;
  transition:height .25s var(--ease);}

.quote-preview{display:none;align-items:center;gap:10px;padding:8px 14px;
  background:var(--fill-1);border-bottom:.5px solid var(--sep);animation:qpIn .25s var(--ease);}
.quote-preview.show{display:flex;}
@keyframes qpIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.quote-preview .qp-bar{width:3px;height:34px;border-radius:2px;background:var(--blue);flex-shrink:0;}
.quote-preview .qp-info{flex:1;min-width:0;}
.quote-preview .qp-from{font-size:11px;font-weight:600;color:var(--blue);margin-bottom:2px;}
.quote-preview .qp-text{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.quote-preview .qp-close{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);background:var(--fill-2);flex-shrink:0;transition:transform .18s;}
.quote-preview .qp-close:active{transform:scale(.86);}

.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;}
.composer .icon-btn.tool-btn{margin-bottom:4px;color:var(--text-secondary);transition:transform .3s var(--ease);}
.composer .icon-btn.tool-btn.active{transform:rotate(45deg);color:var(--blue);}
.composer textarea{flex:1;resize:none;border:none;outline:none;font-family:inherit;
  background:var(--bubble-other);color:var(--text);border-radius:20px;padding:9px 14px;font-size:16px;
  line-height:1.35;max-height:112px;min-height:38px;transition:background .2s;}
.composer textarea::placeholder{color:var(--text-tertiary);}
.send-btn{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;transition:transform .18s var(--ease),opacity .2s,background .2s;margin-bottom:2px;}
.send-btn:active{transform:scale(.84);}
.send-btn:disabled{background:var(--fill-2);color:var(--text-tertiary);}

#toolPanel{height:0;overflow:hidden;background:var(--bg);transition:height .3s var(--ease);
  display:flex;flex-direction:column;}
#toolPanel.show{height:260px;border-top:.5px solid var(--sep);}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;padding:24px 20px;}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s;}
.tool-item:active{transform:scale(.9);}
.tool-item .ti-icon{width:60px;height:60px;border-radius:16px;background:var(--card-bg-solid);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.04);
  color:var(--text);border:.5px solid var(--sep);}
.tool-item span{font-size:12px;color:var(--text-secondary);}

#stickerPanel{height:250px;display:none;flex-direction:column;border-top:.5px solid var(--sep);background:var(--bg);}
#stickerPanel.show{display:flex;}
.sticker-panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  font-size:12px;color:var(--text-secondary);font-weight:500;}
.sticker-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:12px;padding:10px 16px 20px;align-content:start;}
.sticker-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.sticker-item .img-box{width:70px;height:70px;border-radius:12px;overflow:hidden;background:var(--fill-1);
  display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.sticker-item:active .img-box{transform:scale(.9);}
.sticker-item img{max-width:100%;max-height:100%;object-fit:contain;}
.sticker-item span{font-size:11px;color:var(--text-tertiary);width:100%;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px 32px;text-align:center;color:var(--text-tertiary);}
.empty .e-title{font-size:15px;font-weight:600;color:var(--text-secondary);}
.empty .e-desc{font-size:13px;line-height:1.6;max-width:260px;}
.empty .e-icon{width:64px;height:64px;border-radius:22px;border:1.5px dashed var(--sep);
  display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}

.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;scrollbar-width:none;}
.scroll-area::-webkit-scrollbar{display:none;}
.card{background:var(--card-bg);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-radius:var(--radius-l);border:.5px solid var(--sep);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;}

.player-card{display:flex;flex-direction:column;gap:16px;}
.player-top{display:flex;gap:14px;align-items:center;}
.cover{width:78px;height:78px;border-radius:18px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,var(--fill-1),var(--fill-2));
  display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);position:relative;}
.cover img{width:100%;height:100%;object-fit:cover;}
.player-meta{flex:1;min-width:0;}
.player-meta .p-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-meta .p-artist{font-size:13px;color:var(--text-secondary);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-meta .p-status{font-size:11px;color:var(--text-tertiary);margin-top:8px;font-weight:500;letter-spacing:.02em;}
.seek-wrap{display:flex;flex-direction:column;gap:6px;}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--fill-2);outline:none;}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer;}
.seek::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--text);}
.seek-time{display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;}
.controls{display:flex;align-items:center;justify-content:center;gap:26px;}
.ctrl-btn{color:var(--text);padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:transform .18s var(--ease),background .2s;}
.ctrl-btn:active{transform:scale(.86);background:var(--fill-1);}
.ctrl-btn.main{width:56px;height:56px;background:var(--text);color:var(--bg);border-radius:50%;}
.ctrl-btn.main:active{transform:scale(.9);}

.song-list{display:flex;flex-direction:column;}
.song-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:.5px solid var(--sep);
  cursor:pointer;transition:background .2s var(--ease);border-radius:10px;}
.song-item:last-child{border-bottom:none;}
.song-item:active{background:var(--fill-1);}
.song-item.playing .s-name{color:var(--blue);}
.song-item .s-idx{width:20px;text-align:center;font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;}
.song-item .s-cover{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0;
  background:var(--fill-1);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
.song-item .s-cover img{width:100%;height:100%;object-fit:cover;}
.song-item .s-info{flex:1;min-width:0;}
.song-item .s-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-item .s-artist{font-size:12px;color:var(--text-secondary);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-item .s-del{color:var(--text-tertiary);}

.moment-card{padding:14px 16px;}
.moment-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.moment-head .m-info{flex:1;min-width:0;}
.moment-head .m-name{font-size:14px;font-weight:600;}
.moment-head .m-time{font-size:11px;color:var(--text-tertiary);margin-top:2px;}
.moment-text{font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;}
.moment-imgs{display:grid;gap:5px;margin-bottom:10px;}
.moment-imgs.n1{grid-template-columns:minmax(0,1fr);max-width:62%;}
.moment-imgs.n2{grid-template-columns:repeat(2,1fr);}
.moment-imgs.n3{grid-template-columns:repeat(3,1fr);}
.moment-imgs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;}
.moment-imgs.n1 img{aspect-ratio:4/3;border-radius:12px;}
.moment-actions{display:flex;gap:6px;padding-top:8px;border-top:.5px solid var(--sep);}
.moment-actions button{flex:1;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12.5px;padding:7px 0;border-radius:10px;font-weight:500;
  transition:background .2s,transform .18s var(--ease);}
.moment-actions button:active{background:var(--fill-1);transform:scale(.95);}
.moment-actions button.liked{color:var(--danger);}
.moment-comments{margin-top:10px;background:var(--fill-1);border-radius:12px;padding:10px 12px;
  display:flex;flex-direction:column;gap:7px;}
.moment-comments .cmt{font-size:13px;line-height:1.45;word-break:break-word;}
.moment-comments .cmt b{font-weight:600;color:var(--text-secondary);}
.like-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto;}

/* 信箱 */
.letter-fullscreen{position:fixed;inset:0;z-index:800;background:var(--bg);display:none;flex-direction:column;}
.letter-fullscreen.show{display:flex;}
.letter-item{display:flex;gap:12px;padding:16px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .2s;}
.letter-item:active{background:var(--fill-1);}
.letter-item.unread .l-title{font-weight:600;color:var(--blue);}
.letter-item.unread .l-title::before{content:'';display:inline-block;width:6px;height:6px;background:var(--danger);border-radius:50%;margin-right:6px;vertical-align:middle;margin-bottom:2px;}
.l-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#00c6ff);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.letter-item.from-me .l-icon{background:linear-gradient(135deg,#ff8a00,#e52e71);}
.l-info{flex:1;min-width:0;}
.l-title{font-size:15px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.l-preview{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.l-time{font-size:11px;color:var(--text-tertiary);margin-top:4px;}

.group{background:var(--card-bg);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-radius:var(--radius-l);border:.5px solid var(--sep);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:14px;}
.group-title{font-size:12px;font-weight:600;color:var(--text-secondary);padding:0 18px 8px;letter-spacing:.04em;}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;border-bottom:.5px solid var(--sep);
  transition:background .2s var(--ease);width:100%;text-align:left;color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;}
.row:last-child{border-bottom:none;}
.row:active{background:var(--fill-1);}
.row .r-label{flex:1;min-width:0;}
.row .r-value{font-size:14px;color:var(--text-tertiary);max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .r-chev{color:var(--text-tertiary);flex-shrink:0;}

.profile-head{display:flex;align-items:center;gap:14px;padding:18px 16px;}
.profile-head .p-text{flex:1;min-width:0;}
.profile-head .p-name{font-size:19px;font-weight:600;}
.profile-head .p-sub{font-size:12px;color:var(--text-tertiary);margin-top:4px;}

.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;display:block;background:var(--fill-2);}
.avatar-ph{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(120,170,255,.55),rgba(255,150,200,.45));
  color:#fff;font-weight:600;letter-spacing:.02em;}

.switch{width:50px;height:30px;border-radius:15px;background:var(--fill-2);position:relative;
  transition:background .3s var(--ease);flex-shrink:0;border:none;padding:0;pointer-events:auto;cursor:pointer;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--ease);}
.switch.on{background:#34c759;}
.switch.on::after{transform:translateX(20px);}

.num-input{width:70px;padding:8px 10px;border-radius:10px;border:.5px solid var(--sep);
  background:var(--fill-1);color:var(--text);font-size:15px;text-align:center;
  outline:none;font-family:inherit;font-variant-numeric:tabular-nums;}
.num-input:focus{border-color:var(--blue);}

#modalRoot{position:fixed;inset:0;z-index:900;pointer-events:none;}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;
  padding:24px;opacity:0;transition:opacity .28s var(--ease);pointer-events:auto;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.mask.show{opacity:1;}
.mask.bottom{align-items:flex-end;padding:0;}
.modal-card{width:100%;max-width:380px;border-radius:var(--radius-l);background:var(--card-bg-solid);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  box-shadow:0 20px 60px rgba(0,0,0,.24);transform:scale(.94) translateY(10px);
  transition:transform .34s var(--ease);overflow:hidden;max-height:86vh;display:flex;flex-direction:column;}
.mask.show .modal-card{transform:none;}
.mask.bottom .modal-card{max-width:520px;border-radius:var(--radius-l) var(--radius-l) 0 0;
  transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom);}
.mask.bottom.show .modal-card{transform:none;}
.modal-body{padding:22px 22px 18px;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:600;text-align:center;margin-bottom:8px;}
.modal-text{font-size:13.5px;line-height:1.6;color:var(--text-secondary);text-align:center;}
.modal-actions{display:flex;border-top:.5px solid var(--sep);}
.modal-actions button{flex:1;padding:15px 8px;font-size:16px;color:var(--blue);font-weight:500;transition:background .2s;}
.modal-actions button:active{background:var(--fill-1);}
.modal-actions button + button{border-left:.5px solid var(--sep);}
.modal-actions button.danger{color:var(--danger);}
.modal-actions button.primary{font-weight:600;}
.modal-actions button:disabled{opacity:.4;pointer-events:none;}

.context-menu-mask{position:fixed;inset:0;z-index:980;background:rgba(0,0,0,.05);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);}
.context-menu{position:fixed;background:var(--bg-elevated);border-radius:12px;display:flex;flex-direction:row;align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:981;animation:ctxIn .18s var(--ease);
  overflow:hidden;border:.5px solid var(--sep);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);}
@keyframes ctxIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.context-menu button{padding:13px 18px;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap;
  border-right:.5px solid var(--sep);transition:background .2s;}
.context-menu button:last-child{border-right:none;}
.context-menu button:active{background:var(--fill-1);}
.context-menu button.danger{color:var(--danger);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.02em;}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea,.field select{
  width:100%;padding:11px 14px;border-radius:12px;border:.5px solid var(--sep);
  background:var(--fill-1);color:var(--text);font-size:15px;outline:none;font-family:inherit;resize:none;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);}
.field .hint{font-size:11.5px;color:var(--text-tertiary);line-height:1.55;margin-top:6px;}

.btn{width:100%;padding:12px;border-radius:14px;background:var(--blue);color:#fff;
  font-size:15px;font-weight:600;transition:transform .18s var(--ease),opacity .2s;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:var(--fill-1);color:var(--text);}
.btn.danger{background:var(--danger);}

.list-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:.5px solid var(--sep);}
.list-item:last-child{border-bottom:none;}
.list-item .li-main{flex:1;min-width:0;}
.list-item .li-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-item .li-sub{font-size:12px;color:var(--text-tertiary);margin-top:2px;}

#toastRoot{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));z-index:1000;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 24px;}
.toast{background:rgba(28,28,30,.9);color:#fff;font-size:13.5px;font-weight:500;padding:10px 18px;
  border-radius:20px;max-width:100%;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;transform:translateY(10px);transition:opacity .3s var(--ease),transform .3s var(--ease);
  text-align:center;line-height:1.4;}
[data-theme="dark"] .toast{background:rgba(240,240,245,.94);color:#000;}
.toast.show{opacity:1;transform:none;}

#callLayer{position:fixed;inset:0;z-index:950;pointer-events:none;}
#callLayer > *{pointer-events:auto;}
.call-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;background:var(--bg);
  backdrop-filter:blur(50px) saturate(180%);-webkit-backdrop-filter:blur(50px) saturate(180%);
  padding:60px 24px calc(40px + env(safe-area-inset-bottom));opacity:0;transition:opacity .35s var(--ease);}
.call-screen.show{opacity:1;}
.call-screen .c-name{font-size:24px;font-weight:600;margin-top:22px;}
.call-screen .c-status{font-size:14px;color:var(--text-secondary);margin-top:8px;
  font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.call-screen .c-spacer{flex:1;}
.call-btns{display:flex;gap:44px;align-items:flex-start;margin-bottom:14px;}
.call-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;}
.call-btn-wrap span{font-size:11.5px;color:var(--text-secondary);font-weight:500;}
.call-btn{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--fill-2);color:var(--text);transition:transform .18s var(--ease),background .2s;}
.call-btn:active{transform:scale(.88);}
.call-btn.hang{background:var(--danger);color:#fff;}
.call-btn.accept{background:#34c759;color:#fff;}
.call-btn.on{background:var(--text);color:var(--bg);}

.call-mini{position:fixed;width:190px;height:64px;border-radius:20px;background:var(--bg-elevated);
  backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%);
  border:.5px solid var(--sep);box-shadow:0 12px 40px rgba(0,0,0,.28);
  display:flex;align-items:center;gap:9px;padding:0 10px;z-index:960;touch-action:none;cursor:grab;
  transition:box-shadow .2s;}
.call-mini:active{cursor:grabbing;}
.call-mini .m-info{flex:1;min-width:0;pointer-events:none;}
.call-mini .m-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.call-mini .m-time{font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;margin-top:1px;}
.call-mini button{width:28px;height:28px;border-radius:50%;background:var(--fill-1);
  display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;
  transition:transform .18s var(--ease);}
.call-mini button:active{transform:scale(.85);}
.call-mini button.hang{background:var(--danger);color:#fff;}

.call-banner{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:965;
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:20px;background:var(--bg-elevated);
  backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%);
  border:.5px solid var(--sep);box-shadow:0 12px 40px rgba(0,0,0,.26);animation:bannerIn .4s var(--ease);}
@keyframes bannerIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:none;}}
.call-banner .b-info{flex:1;min-width:0;cursor:pointer;}
.call-banner .b-name{font-size:13.5px;font-weight:600;}
.call-banner .b-sub{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
.call-banner button{width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:transform .18s var(--ease);}
.call-banner button:active{transform:scale(.86);}
.call-banner button.accept{background:#34c759;color:#fff;}
.call-banner button.decline{background:var(--danger);color:#fff;}

.picker-list{max-height:56vh;overflow-y:auto;margin:0 -6px;}
.picker-item{display:flex;align-items:center;gap:11px;padding:10px 6px;border-radius:12px;
  width:100%;text-align:left;color:var(--text);transition:background .2s var(--ease);font-family:inherit;}
.picker-item:active{background:var(--fill-1);}
.hr{height:.5px;background:var(--sep);margin:14px 0;}
.section-label{font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:.04em;margin-bottom:8px;}

/* 商城样式 */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px;}
.shop-item{background:var(--card-bg-solid);border-radius:16px;border:.5px solid var(--sep);overflow:hidden;display:flex;flex-direction:column;position:relative;}
.shop-img{width:100%;height:120px;object-fit:cover;background:var(--fill-1);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
.shop-info{padding:10px;}
.shop-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shop-price{font-size:16px;color:var(--danger);font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;}
.shop-actions{display:flex;gap:6px;margin-top:8px;}
.shop-btn{flex:1;padding:6px 0;border-radius:8px;font-size:12px;font-weight:600;text-align:center;background:var(--fill-1);color:var(--text);transition:transform .15s;}
.shop-btn:active{transform:scale(.95);}
.shop-btn.primary{background:var(--blue);color:#fff;}

.wallet-bar{display:flex;justify-content:space-between;padding:14px;background:var(--card-bg-solid);margin:0 14px 14px;border-radius:16px;border:.5px solid var(--sep);box-shadow:var(--shadow);}
.wallet-col{flex:1;text-align:center;cursor:pointer;}
.wallet-col:active{opacity:.7;}
.wallet-lbl{font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
.wallet-val{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
.wallet-val.friend{color:var(--blue);}

.order-list{padding:0 14px;margin-bottom:20px;}
.order-card{background:var(--card-bg-solid);border-radius:12px;padding:12px;margin-bottom:10px;border:.5px solid var(--sep);}
.order-head{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
.order-body{font-size:14px;color:var(--text);}
.order-status{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;margin-top:6px;}
.order-status.pending{background:rgba(255,149,0,.15);color:#ff9500;}
.order-status.done{background:rgba(52,199,89,.15);color:#34c759;}
.order-status.rejected{background:rgba(255,59,48,.15);color:var(--danger);}
</style>
</head>
<body>

<div id="splash"><div class="splash-text">传讯</div></div>

<div id="app">
  <section class="page active" id="page-chat">
    <div class="nav">
      <div class="nav-side">
        <button class="icon-btn" id="btnFriendPicker" title="切换好友"></button>
      </div>
      <button class="nav-title" id="chatTitle">
        <span class="name">传讯</span>
      </button>
      <div class="nav-actions">
        <button class="icon-btn" id="btnCall" title="通话"></button>
        <button class="icon-btn" id="btnChatSettings" title="设置"></button>
        <button class="icon-btn danger" id="btnClearChat" title="清空会话"></button>
      </div>
    </div>
    <div id="chatList"></div>
    <div class="composer-wrap">
      <div class="quote-preview" id="quotePreview">
        <div class="qp-bar"></div>
        <div class="qp-info">
          <div class="qp-from" id="qpFrom">引用</div>
          <div class="qp-text" id="qpText"></div>
        </div>
        <button class="qp-close" id="qpClose" title="取消引用"></button>
      </div>
      <div class="composer">
        <textarea id="msgInput" rows="1" placeholder="iMessage"></textarea>
        <button class="icon-btn tool-btn" id="btnToggleTool" title="工具箱"></button>
        <button class="send-btn" id="btnSend" disabled></button>
      </div>
      <div id="toolPanel">
        <div class="tool-grid">
          <button class="tool-item" id="btnToolRedPacket">
            <div class="ti-icon" id="icoRedPacket"></div>
            <span>红包</span>
          </button>
          <button class="tool-item" id="btnToolSticker">
            <div class="ti-icon" id="icoSticker"></div>
            <span>表情</span>
          </button>
          <button class="tool-item" id="btnToolShareMusic">
            <div class="ti-icon" id="icoShareMusic"></div>
            <span>音乐</span>
          </button>
        </div>
      </div>
      <div id="stickerPanel">
        <div class="sticker-panel-head">
          <span>表情包</span>
          <button class="btn ghost" id="btnQuickAddSticker" style="width:auto;padding:5px 10px;font-size:12px;border-radius:8px;">添加表情</button>
        </div>
        <div class="sticker-grid" id="stickerGrid"></div>
      </div>
    </div>
  </section>

  <section class="page" id="page-music">
    <div class="nav">
      <div class="nav-side"></div>
      <div class="nav-title" style="pointer-events:none;"><span class="name">一起听</span></div>
      <div class="nav-actions"><button class="icon-btn" id="btnInvite" title="邀请好友"></button></div>
    </div>
    <div class="scroll-area" id="musicScroll"></div>
  </section>

  <section class="page" id="page-moments">
    <div class="nav">
      <div class="nav-side"></div>
      <div class="nav-title" style="pointer-events:none;"><span class="name">朋友圈</span></div>
      <div class="nav-actions"><button class="icon-btn" id="btnPost" title="发布"></button></div>
    </div>
    <div class="scroll-area" id="momentsScroll"></div>
  </section>

  <section class="page" id="page-shop">
    <div class="nav">
      <div class="nav-side">
        <button class="icon-btn" id="btnAddProduct" title="上架商品"></button>
      </div>
      <div class="nav-title" style="pointer-events:none;"><span class="name">商城</span></div>
      <div class="nav-actions">
        <button class="icon-btn" id="btnViewWishlist" title="心愿单"></button>
        <button class="icon-btn" id="btnOpenCart" title="购物车"></button>
      </div>
    </div>
    <div class="scroll-area" id="shopScroll" style="padding:0;padding-bottom:14px;">
      <div class="wallet-bar">
        <div class="wallet-col" id="btnEditUserWallet">
          <div class="wallet-lbl">我的余额</div>
          <div class="wallet-val" id="userBalance">¥0.00</div>
        </div>
        <div style="width:1px;background:var(--sep);margin:0 10px;"></div>
        <div class="wallet-col" id="btnEditFriendWallet">
          <div class="wallet-lbl">对方余额</div>
          <div class="wallet-val friend" id="friendBalance">¥0.00</div>
        </div>

/* ============================================================
   [NEW] 后台保活与通知 Service Worker 桥接模块
   ============================================================ */
(function (global) {
  var SW_URL = './sw.js';
  var tasks = new Map();
  var timers = new Map();
  var reg = null;
  var ready = false;

  var genId = function () { return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  function postToSW(msg, timeout) {
    return new Promise(function (resolve) {
      var sw = navigator.serviceWorker.controller || (reg && (reg.active || reg.waiting || reg.installing));
      if (!sw) { resolve(null); return; }
      var ch = new MessageChannel();
      var done = false;
      var tid = setTimeout(function () { finish(null); }, timeout || 4000);
      function finish(v) { if (done) return; done = true; clearTimeout(tid); try { ch.port1.close(); } catch (e) {} resolve(v); }
      ch.port1.onmessage = function (e) { finish(e.data); };
      try { sw.postMessage(msg, [ch.port2]); } catch (e) { finish(null); }
    });
  }

  async function init() {
    if (!('serviceWorker' in navigator)) return false;
    try {
      reg = await navigator.serviceWorker.register(SW_URL, { scope: './' });
      await navigator.serviceWorker.ready;
      reg = (await navigator.serviceWorker.getRegistration('./')) || reg;
    } catch (e) { return false; }

    navigator.serviceWorker.addEventListener('message', function(event) {
      var d = event.data || {};
      if (d.type === 'TASK_FIRED' && d.task) {
        // 如果在后台由 SW 触发了通知，主线程如果没被冻结，继续处理逻辑
      }
    });
    ready = true;
    return true;
  }

  async function schedule(opt) {
    var task = { id: opt.id || genId(), fireAt: opt.fireAt || (Date.now() + (opt.delay || 0)), title: opt.title || '传讯', body: opt.body || '', tag: opt.tag || '', url: opt.url || location.href };
    tasks.set(task.id, task);
    if (task.fireAt <= Date.now()) return;

    if (document.visibilityState === 'hidden' && task.fireAt - Date.now() <= 5 * 60 * 1000) {
      var res = await postToSW({ type: 'SCHEDULE', task: task });
      if (res && res.ok) return true;
    }
    
    // 前台或超过5分钟，交给主线程定时器
    var delay = task.fireAt - Date.now();
    if (delay > 0x7fffffff) delay = 0x7fffffff;
    timers.set(task.id, setTimeout(async function() {
      timers.delete(task.id);
      if (document.visibilityState === 'visible') {
        toast(task.title + ': ' + task.body);
      } else if (reg && Notification.permission === 'granted') {
        try { await reg.showNotification(task.title, { body: task.body, tag: task.tag }); } catch(e){}
      }
    }, delay));
    return true;
  }

  function cancelAll() {
    tasks.clear();
    timers.forEach(function(t){ clearTimeout(t); });
    timers.clear();
    postToSW({ type: 'RECLAIM' }).catch(function(){});
  }

  global.BgNotify = { init: init, schedule: schedule, cancelAll: cancelAll, isReady: function() { return ready; } };
})(window);

/* ============================================================

var KeepAlive = (function () {
  var ctx = null, osc = null, gain = null, on = false;
  async function startAudio() {
    if (on) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') await ctx.resume();
      if (!osc) {
        osc = ctx.createOscillator();
        gain = ctx.createGain();
        gain.gain.value = 0.0001;
        osc.frequency.value = 40;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
      }
      on = true;
      return true;
    } catch (e) { return false; }
  }
  function stopAudio() {
    on = false;
    try { if (osc) osc.stop(); } catch(e){}
    osc = null;
    try { if (ctx) ctx.close(); } catch(e){}
    ctx = null;
  }
  return { startAudio: startAudio, stopAudio: stopAudio, isAudioOn: function () { return on; } };
})();

function fmtTime(ts){
  const d = new Date(ts), n = new Date();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if (d.toDateString() === n.toDateString()) return hm;
  const y = new Date(n); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '昨天 ' + hm;
  const sameYear = d.getFullYear() === n.getFullYear();
  return (sameYear ? '' : d.getFullYear() + '年') + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? h + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}
function fmtRel(ts){
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff/86400000) + '天前';
  return fmtTime(ts);
}

// 工具函数：提取歌手名称 (强化版，解决未知歌手问题)
function getArtistName(s) {
  if (!s) return '未知歌手';
  
  // 1. 优先处理常见数组或对象结构
  if (s.ar && Array.isArray(s.ar)) {
    const names = s.ar.map(a => (typeof a === 'string' ? a : a.name)).filter(Boolean);
    if (names.length) return names.join(' / ');
  }
  if (s.artists && Array.isArray(s.artists)) {
    const names = s.artists.map(a => (typeof a === 'string' ? a : a.name)).filter(Boolean);
    if (names.length) return names.join(' / ');
  }
  if (s.artist) {
    if (typeof s.artist === 'string' && s.artist.trim()) return s.artist;
    if (Array.isArray(s.artist)) {
      const names = s.artist.map(a => (typeof a === 'string' ? a : a.name)).filter(Boolean);
      if (names.length) return names.join(' / ');
    }
    if (s.artist.name) return s.artist.name;
  }
  if (s.singer) {
    if (typeof s.singer === 'string' && s.singer.trim()) return s.singer;
    if (Array.isArray(s.singer)) {
      const names = s.singer.map(a => (typeof a === 'string' ? a : a.name)).filter(Boolean);
      if (names.length) return names.join(' / ');
    }
  }
  if (s.creator) {
    if (typeof s.creator === 'string' && s.creator.trim()) return s.creator;
    if (s.creator.name) return s.creator.name;
  }
  
  // 2. 暴力正则提取，防止在非常深的嵌套里
  try {
    const str = JSON.stringify(s);
    const m1 = str.match(/"artist"\s*:\s*"([^"]+)"/i);
    if (m1 && m1[1] && m1[1] !== '未知歌手') return m1[1];
    
    const m2 = str.match(/"singer"\s*:\s*"([^"]+)"/i);
    if (m2 && m2[1] && m2[1] !== '未知歌手') return m2[1];
    
    // 匹配 artists / ar 数组里的第一个 name
    const m3 = str.match(/"(?:artists|ar)"\s*:\s*\[\s*\{[^}]*"name"\s*:\s*"([^"]+)"/i);
    if (m3 && m3[1]) return m3[1];
  } catch(e) {}
  
  return '未知歌手';
}

let _audioDB = null;
function openAudioDB(){
  if (_audioDB) return Promise.resolve(_audioDB);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('chuanxun_audio', 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('files')) req.result.createObjectStore('files'); };
    req.onsuccess = () => { _audioDB = req.result; resolve(_audioDB); };
    req.onerror = () => reject(req.error);
  });
}
async function putAudio(key, blob){
  const db = await openAudioDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(blob, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function getAudio(key){
  const db = await openAudioDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readonly');
    const r = tx.objectStore('files').get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function delAudio(key){
  const db = await openAudioDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

function toast(msg, ms = 2400){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 320); }, ms);
}

function openModal(opts){
  const root = $('#modalRoot');
  const mask = document.createElement('div');
  mask.className = 'mask' + (opts.bottom ? ' bottom' : '');
  const actions = opts.actions || [];
  const actionsHTML = actions.length
    ? '<div class="modal-actions">' + actions.map((a, i) =>
        '<button data-i="' + i + '" class="' + (a.danger ? 'danger ' : '') + (a.primary ? 'primary' : '') + '">' + esc(a.text) + '</button>'
      ).join('') + '</div>'
    : '';
  mask.innerHTML =
    '<div class="modal-card">' +
      '<div class="modal-body">' +
        (opts.title ? '<div class="modal-title">' + esc(opts.title) + '</div>' : '') +
        (opts.text ? '<div class="modal-text">' + esc(opts.text) + '</div>' : '') +
        (opts.bodyHTML || '') +
      '</div>' + actionsHTML +
    '</div>';
  root.appendChild(mask);
  requestAnimationFrame(() => mask.classList.add('show'));
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    mask.classList.remove('show');
    setTimeout(() => mask.remove(), 340);
  };
  if (opts.dismissible !== false){
    mask.addEventListener('click', e => { if (e.target === mask) close(); });
  }
  actions.forEach((a, i) => {
    const btn = mask.querySelector('button[data-i="' + i + '"]');
    if (btn) btn.addEventListener('click', () => {
      if (a.onClick && a.onClick(mask, close) === false) return;
      close();
    });
  });
  return { mask, close, card: mask.querySelector('.modal-card') };
}

function confirmBox(title, text, onOk, okText, danger){
  return openModal({
    title, text,
    actions: [
      { text: '取消' },
      { text: okText || '确定', danger: !!danger, primary: !danger, onClick: () => { if (onOk) onOk(); } }
    ]
  });
}

}

function getAllCards(){
  const groups = DB.groups();
  const out = [];
  groups.forEach(g => {
    if (g.disabled) return; // 增加屏蔽过滤
    (g.cards || []).forEach(c => { if (c && c.trim()) out.push({ type: 'text', content: c }); });
  });
  const stickers = DB.stickers();
  stickers.forEach(s => { if (s.url) out.push({ type: 'sticker', content: s.url }); });
  return out;
}

function getTextCards(){
  const groups = DB.groups();
  const out = [];
  groups.forEach(g => {

function msgHTML(m, prevTs){
  let html = '';
  if (prevTs == null || m.ts - prevTs > 5 * 60 * 1000){
    html += '<div class="time-sep">' + esc(fmtTime(m.ts)) + '</div>';
  }
  if (m.revoked){
    html += '<div class="revoke-note">' + (m.from === 'me' ? '你' : '对方') + '撤回了一条消息</div>';
    return html;
  }
  if (m.type === 'invite'){
    const f = getCurrentFriend();
    const friendName = f ? f.name : '对方';
    const title = m.from === 'me' ? '你邀请' + friendName + '一起听' : friendName + '邀请你一起听';
    const statusText = m.inviteStatus === 'accepted' ? '已接受' : m.inviteStatus === 'rejected' ? '已拒绝' : '等待接受';
    
    if (m.from === 'other' && m.inviteStatus === 'pending') {
        html += '<div class="invite-card">' +
          '<div class="ic-title">' + icon('wave', 18) + '<span>一起听邀请</span></div>' +
          '<div class="ic-desc">' + title + ' · <button class="invite-accept-btn" data-accept-invite="' + m.id + '">接受</button></div>' +
        '</div>';
    } else {
        html += '<div class="invite-card ' + (m.from === 'me' ? 'me' : '') + '">' +
          '<div class="ic-title">' + icon('wave', 18) + '<span>一起听邀请</span></div>' +
          '<div class="ic-desc">' + title + ' · ' + statusText + '</div>' +
        '</div>';
    }
    return html;
  }
  if (m.type === 'gift') {
    const g = m.giftData;
    html += '<div class="msg-row ' + (m.from === 'me' ? 'me' : 'other') + '" style="flex-direction:column;align-items:' + (m.from === 'me' ? 'flex-end' : 'flex-start') + ';">' +
      (m.quote ? '<div style="max-width:240px;width:100%;">' + buildQuoteHTML(m.quote) + '</div>' : '') +
      '<div class="gift-card" data-msg="' + m.id + '">' +
        '<div class="gift-top">' +
          '<div class="gift-icon">' + esc(g.icon || '🎁') + '</div>' +
          '<div class="gift-info">' +
             '<div class="gift-name">' + esc(g.name) + '</div>' +
             '<div class="gift-desc">' + (m.from === 'me' ? '送给你的礼物' : '送来的礼物') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="gift-bottom">价值 ¥' + esc(g.price) + '</div>' +
      '</div>' +
    '</div>';
    return html;
  }
  if (m.type === 'sticker'){
    html += '<div class="msg-row ' + (m.from === 'me' ? 'me' : 'other') + '" style="flex-direction:column;align-items:' + (m.from === 'me' ? 'flex-end' : 'flex-start') + ';gap:4px;">' +
      (m.quote ? '<div style="max-width:76%;">' + buildQuoteHTML(m.quote) + '</div>' : '') +
      '<img class="sticker-msg" src="' + esc(m.text) + '" data-msg="' + m.id + '" alt="">' +
    '</div>';
    return html;
  }
  if (m.type === 'music') {
    const song = m.musicData;
    html += '<div class="msg-row ' + (m.from === 'me' ? 'me' : 'other') + '" style="flex-direction:column;align-items:' + (m.from === 'me' ? 'flex-end' : 'flex-start') + ';">' +
      (m.quote ? '<div style="max-width:240px;width:100%;">' + buildQuoteHTML(m.quote) + '</div>' : '') +
      '<div class="music-card" data-msg="' + m.id + '" data-play-music=\'' + JSON.stringify(song) + '\'>' +
        '<img class="music-cover" src="' + esc(song.cover || '') + '">' +
        '<div class="music-info">' +
           '<div class="music-name">' + esc(song.name) + '</div>' +
           '<div class="music-artist">' + esc(song.artist) + '</div>' +
        '</div>' +
        '<div class="music-play-btn">' + icon('play', 14) + '</div>' +
      '</div>' +
    '</div>';
    return html;
  }
  if (m.type === 'redpacket') {
    const isReceived = m.status === 'received';
    const isMe = m.from === 'me';
    let actionHTML = '';
    if (isReceived) actionHTML = '<div class="rp-sub" style="color:var(--text-secondary);">已领取</div>';
    else if (isMe) actionHTML = '<div class="rp-sub" style="color:var(--text-secondary);">等待对方领取</div>';
    else actionHTML = '<button class="rp-btn" data-claim="' + m.id + '">领取红包</button>';

    html += '<div class="rp-wrap ' + (isMe ? 'me' : 'other') + '">' +
      '<div class="rp-card ' + (isReceived ? 'received' : '') + '" data-rp-toggle="' + m.id + '">' +
        (m.quote ? '<div class="rp-quote">' +
          '<span class="bq-from">' + esc(m.quote.from === 'me' ? '你' : (getCurrentFriend()?.name || '对方')) + '</span>' +

  const quoteHTML = buildQuoteHTML(m.quote);
  html += '<div class="msg-row ' + cls + '"><div class="bubble ' + cls + '" data-msg="' + m.id + '">' +
    quoteHTML + esc(m.text) + '</div></div>';
  return html;

function renderChat(){

        '<div class="e-icon">' + icon('personPlus', 28) + '</div>' +
        '<div class="e-title">还没有好友</div>' +
        '<div class="e-desc">请前往「我的」页面添加好友，然后就可以开始传讯了。</div>' +
      '</div>';
    return;
  }
  const msgs = DB.chat(f.id);
  if (!msgs.length){
    list.innerHTML = '<div class="empty">' +
        '<div class="e-icon">' + icon('message', 28) + '</div>' +
        '<div class="e-title">' + esc(f.name) + '</div>' +
        '<div class="e-desc">发送第一条消息，开始你们的对话。</div>' +

function bindMessageEvents(){

      openMessageMenu(mid, el);
    });
  });
  
  $$('#chatList [data-rp-toggle]').forEach(el => {
    el.querySelector('.rp-header').addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.toggle('expanded');
    });
    attachLongPress(el, (e) => {
       const mid = el.dataset.rpToggle;
       openMessageMenu(mid, el);
    });
  });

  $$('#chatList [data-play-music]').forEach(el => {
    el.addEventListener('click', () => {
       const song = JSON.parse(el.dataset.playMusic);
       const list = DB.playlist();
       let idx = list.findIndex(s => s.id === song.id);
       if (idx === -1) {
          list.push(song); DB.setPlaylist(list);
          idx = list.length - 1;
       }
       switchTab('music');
       Player.load(idx, true);
    });
  });

  $$('#chatList [data-accept-invite]').forEach(btn => {
    btn.addEventListener('click', (e) => {
       e.stopPropagation();
       const mid = btn.dataset.acceptInvite;
       const f = getCurrentFriend();
       const msgs = DB.chat(f.id);
       const m = msgs.find(x => x.id === mid);
       if (m && m.inviteStatus === 'pending') {
          m.inviteStatus = 'accepted';
          DB.setChat(f.id, msgs);
          DB.setTogether({ friendId: f.id, status: 'active', startedAt: Date.now(), messageId: mid });
          renderChat();
          switchTab('music');
          if (!Player.playing) Player.play();
          toast('已接受邀请，开始一起听');
       }
    });
  });

  $$('#chatList [data-claim]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const mid = btn.dataset.claim;
      const f = getCurrentFriend();
      const msgs = DB.chat(f.id);
      const m = msgs.find(x => x.id === mid);
      if (!m || m.status === 'received') return;
      m.status = 'received';
      DB.setChat(f.id, msgs);
      
      // 领红包加钱
      const amt = parseFloat(m.amount) || 0;
      DB.setUserWallet(DB.userWallet() + amt);
      
      renderChat();
      const newCard = document.querySelector('[data-rp-toggle="' + mid + '"]');
      if (newCard) newCard.classList.add('expanded');
      openModal({
        title: '领取成功',
        bodyHTML: '<div style="text-align:center;padding:20px 0;">' +
            '<div style="width:64px;height:64px;margin:0 auto 12px;background:rgba(255,59,48,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--danger);">' +
              icon('gift', 32) + '</div>' +
            '<div style="font-size:24px;font-weight:600;margin-bottom:8px;">¥<span>' + esc(m.amount || '0.00') + '</span></div>' +

function appendMessage(msg){
  const f = getCurrentFriend();
  if (!f) return;
  const msgs = DB.chat(f.id);
  msgs.push(msg);
  DB.setChat(f.id, msgs);
  const list = $('#chatList');
  if (list.querySelector('.empty')){ renderChat(); return; }
  const prev = msgs.length > 1 ? msgs[msgs.length - 2] : null;
  const tmp = document.createElement('div');
  tmp.innerHTML = msgHTML(msg, prev ? prev.ts : null);
  while (tmp.firstChild) list.appendChild(tmp.firstChild);
  bindMessageEvents();
  scrollToBottom();
}

function pickRandomQuote(msgs){
  const quotable = msgs.filter(m => !m.revoked && m.type !== 'invite' && (m.type === 'text' || m.type === 'sticker' || m.type === 'redpacket' || m.type === 'music' || m.type === 'gift'));
  if (!quotable.length) return null;
  const recent = quotable.slice(-5);
  const q = recent[Math.floor(Math.random() * recent.length)];
  return { id: q.id, from: q.from, text: q.text || '', type: q.type, musicData: q.musicData, giftData: q.giftData };
}

// 处理对方自动回复的核心逻辑
function triggerAutoReply(f) {
  const currentMsgs = DB.chat(f.id);

  // 对方发红包
  if (Math.random() < 0.25) {
    const amt = (Math.random() * 20 + 0.01).toFixed(2);
    const blessings = ['恭喜发财', '大吉大利', '天天开心', '谢谢老板'];
    const bless = blessings[Math.floor(Math.random() * blessings.length)];
    
    if (DB.friendWallet() >= parseFloat(amt)) {
       DB.setFriendWallet(DB.friendWallet() - parseFloat(amt));
       appendMessage({
         id: uid(), from: 'other', type: 'redpacket',
         amount: amt, blessing: bless, status: 'pending', ts: Date.now(),
         quote: Math.random() < 0.35 ? pickRandomQuote(currentMsgs) : null
       });
       return;
    }
  }

  // 对方邀请听歌
  if (Math.random() < 0.1) {
    appendMessage({
      id: uid(), from: 'other', type: 'invite', inviteStatus: 'pending', ts: Date.now()
    });
    return;
  }

  // 对方分享歌曲
  if (Math.random() < 0.2 && DB.playlist().length > 0) {
    const list = DB.playlist();
    const song = list[Math.floor(Math.random() * list.length)];
    appendMessage({
      id: uid(), from: 'other', type: 'music',
      musicData: song, ts: Date.now(),
      quote: Math.random() < 0.35 ? pickRandomQuote(currentMsgs) : null
    });
    return;
  }
  
  // 对方送礼物
  if (Math.random() < 0.15 && DB.friendWallet() > 50) {
     const products = DB.products();
     if (products.length) {
       const p = products[Math.floor(Math.random() * products.length)];
       if (DB.friendWallet() >= p.price) {
          DB.setFriendWallet(DB.friendWallet() - p.price);
          appendMessage({
             id: uid(), from: 'other', type: 'gift', giftData: p, ts: Date.now()
          });
          return;
       }
     }
  }

  const replyQuote = Math.random() < 0.4 ? pickRandomQuote(currentMsgs) : null;

  const activePool = getAllCards();
  if (activePool.length) {
    const pick = activePool[Math.floor(Math.random() * activePool.length)];
    appendMessage({
      id: uid(), from: 'other', type: pick.type,
      text: pick.content, ts: Date.now(),
      quote: replyQuote
    });
  }

  // 概率来电
  if (Math.random() < 0.05 && Call.state === 'idle') {
     setTimeout(() => {
        if (Call.state === 'idle') Call.simulateIncoming();
     }, 2000 + Math.random() * 3000);
  }
}

function sendMessage(isSticker, stickerUrl){
  const f = getCurrentFriend();
  if (!f) return;

  const quote = state.quoting ? {
    id: state.quoting.id, from: state.quoting.from,
    text: state.quoting.text, type: state.quoting.type,
    musicData: state.quoting.musicData, giftData: state.quoting.giftData
  } : null;

  let text = '';
  if (isSticker) {
    text = stickerUrl;
  } else {
    const input = $('#msgInput');
    text = input.value.replace(/\s+$/, '');
    if (!text) return;
    input.value = '';
    autoResizeInput();
    $('#btnSend').disabled = true;
    $('#toolPanel').classList.remove('show');
    $('#stickerPanel').classList.remove('show');
    $('#btnToggleTool').classList.remove('active');
  }

  appendMessage({
    id: uid(), from: 'me',
    type: isSticker ? 'sticker' : 'text',
    text, ts: Date.now(),
    quote: quote
  });

  clearQuote();

  const st = DB.settings();
  const min = Number(st.waitMin) || 0;
  const max = Number(st.waitMax) || 0;
  const lo = Math.min(min, max), hi = Math.max(min, max);
  const wait = Math.max(0, lo + Math.random() * (hi - lo));
  const waitMs = Math.round(wait * 1000);

  if (state.replyTimer) clearTimeout(state.replyTimer);
  state.typingTimer = true;
  showTypingIndicator();

  state.replyFireAt = Date.now() + waitMs;
  state.replyFriendId = f.id;

  // 如果页面切后台，交给 SW 接管通知
  if (document.visibilityState === 'hidden' && waitMs <= 5 * 60 * 1000) {
    BgNotify.schedule({
      fireAt: state.replyFireAt,
      title: f.name,
      body: '对方给你发来一条新消息',
      tag: 'chat_reply'
    });
  }

  state.replyTimer = setTimeout(() => {
    state.replyTimer = null;
    state.replyFireAt = 0;
    state.typingTimer = null;
    hideTypingIndicator();
    triggerAutoReply(f);
  }, waitMs);
}

function sendRedPacket(amount, blessing) {
  const f = getCurrentFriend();
  if (!f) return;
  
  const amt = parseFloat(amount);
  if (DB.userWallet() < amt) {
    toast('余额不足，请先在商城调整余额');
    return;
  }
  
  // 扣除用户余额
  DB.setUserWallet(DB.userWallet() - amt);

  const quote = state.quoting ? {
    id: state.quoting.id, from: state.quoting.from,
    text: state.quoting.text, type: state.quoting.type,
    musicData: state.quoting.musicData, giftData: state.quoting.giftData
  } : null;

  const msgId = uid();
  appendMessage({
    id: msgId, from: 'me', type: 'redpacket',
    amount: amount, blessing: blessing, status: 'pending', ts: Date.now(),
    quote: quote
  });

  clearQuote();

  const st = DB.settings();
  const min = Number(st.waitMin) || 0;
  const max = Number(st.waitMax) || 0;
  const lo = Math.min(min, max), hi = Math.max(min, max);
  const wait = Math.max(1, lo + Math.random() * (hi - lo));
  const waitMs = Math.round(wait * 1000);

  if (state.replyTimer) clearTimeout(state.replyTimer);
  state.typingTimer = true;
  showTypingIndicator();

  state.replyTimer = setTimeout(() => {
    state.replyTimer = null;
    state.typingTimer = null;
    hideTypingIndicator();
    const msgs = DB.chat(f.id);
    const idx = msgs.findIndex(m => m.id === msgId);
    if (idx >= 0) {
      msgs[idx].status = 'received';
      DB.setChat(f.id, msgs);
      
      // 对方领红包加钱
      DB.setFriendWallet(DB.friendWallet() + amt);
      
      renderChat();
    }
  }, waitMs);
}

function doShareMusic(song) {
   const quote = state.quoting ? {
     id: state.quoting.id, from: state.quoting.from,
     text: state.quoting.text, type: state.quoting.type,
     musicData: state.quoting.musicData, giftData: state.quoting.giftData
   } : null;

   if (!list.some(s => s.id === song.id)) {
      list.push(song); DB.setPlaylist(list);
   }

   appendMessage({ id: uid(), from: 'me', type: 'music', musicData: song, ts: Date.now(), quote: quote });
   clearQuote();
   
   const f = getCurrentFriend();
   if (f) {
     const st = DB.settings();
     const wait = Math.max(1, (st.waitMin || 1) + Math.random() * ((st.waitMax || 3) - (st.waitMin || 1)));
     state.typingTimer = true;
     showTypingIndicator();

     }, Math.round(wait * 1000));
   }
}

function openMessageMenu(msgId, targetEl){
  const f = getCurrentFriend();
  if (!f) return;
  const msgs = DB.chat(f.id);
  const idx = msgs.findIndex(m => m.id === msgId);
  if (idx < 0) return;
  const m = msgs[idx];

  const old = document.getElementById('ctxMenu');
  if (old) old.remove();
  const oldMask = document.getElementById('ctxMenuMask');
  if (oldMask) oldMask.remove();

  const mask = document.createElement('div');
  mask.id = 'ctxMenuMask';
  mask.className = 'context-menu-mask';
  mask.addEventListener('click', () => {
    menu.remove();
    mask.remove();
  });

  const menu = document.createElement('div');
  menu.id = 'ctxMenu';
  menu.className = 'context-menu';

  let menuHTML = '';
  if (m.type === 'text' || !m.type) {
    menuHTML += '<button data-action="copy">复制</button>';
  }
  menuHTML += '<button data-action="quote">引用</button>';
  
  if (m.from === 'me') {
    menuHTML += '<button data-action="revoke" class="danger">撤回</button>';
  }
  menu.innerHTML = menuHTML;

  document.body.appendChild(mask);
  document.body.appendChild(menu);

  const rect = targetEl.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();

  let left = rect.left + rect.width / 2 - menuRect.width / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - menuRect.width - 10));

  let top = rect.top - menuRect.height - 10;
  if (top < 44) top = rect.bottom + 10;
  if (top + menuRect.height > window.innerHeight - 10) top = Math.max(10, window.innerHeight - menuRect.height - 10);

  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  menu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      menu.remove();
      mask.remove();

      if (action === 'copy') {
        navigator.clipboard.writeText(m.text || '').then(() => toast('已复制')).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = m.text || '';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          toast('已复制');
        });
      } else if (action === 'quote') {
        state.quoting = { id: m.id, from: m.from, text: m.text || '', type: m.type || 'text', musicData: m.musicData, giftData: m.giftData };
        renderQuotePreview();
        setTimeout(() => { const ta = $('#msgInput'); if (ta) ta.focus(); }, 200);
      } else if (action === 'revoke') {
        confirmBox('撤回消息', '确定撤回这条消息吗？', () => {
          msgs[idx] = { id: m.id, from: m.from, ts: m.ts, revoked: true };
          DB.setChat(f.id, msgs);
          renderChat();
        }, '撤回', true);
      }
    });
  });
}

function attachLongPress(el, cb){
  let timer = null, moved = false, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    moved = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { if (!moved) cb(e); }, 480);
  });
  el.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8){
      moved = true;
      if (timer) clearTimeout(timer);
    }
  });
  const stop = () => { if (timer) clearTimeout(timer); };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
